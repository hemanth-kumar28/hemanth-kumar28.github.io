  <script>
    const WEEKS = [
      {
        id: 1,
        title: "Foundations: geography, ecology, conservation",
        bigIdea: "Foundations of geography and ecology examine organism–environment relationships, systematic approaches, and conservation principles. Understanding movement, chemical interactions, and limiting factors provides the core framework for environmental protection.",
        concepts: [
          { id: "c1-1", term: "Migration", body: "Migration is the regular, seasonal movement of animals, typically along fixed routes between breeding and wintering grounds. It allows species to track seasonal resources and favorable climatic conditions.", trap: "Do not confuse migration with dispersal, which is random or one-way spreading, or translocation, which involves human relocation.", covers: ["w1q1"] },
          { id: "c1-2", term: "Systematic Geography", body: "The systematic approach to geography studies specific phenomena or systems across the Earth as a whole. Alexander von Humboldt developed this approach to discover general physical laws.", trap: "Systematic geography is distinct from regional geography, which was primarily developed by Karl Ritter.", covers: ["w1q2"] },
          { id: "c1-3", term: "Allelopathy", body: "Allelopathy is a biological phenomenon where plants release chemical compounds that inhibit the growth or survival of neighbouring vegetation. For example, teak trees can suppress vegetable crops growing beneath them.", trap: "Allelopathy involves biochemical inhibition between plants, unlike autophagy which is internal cellular degradation.", covers: ["w1q3"] },
          { id: "c1-4", term: "Habitat Degradation", body: "Habitat degradation occurs when an ecosystem remains physically intact but declines in environmental quality. Pollution, such as sewage and plastic waste in lakes, reduces the population of organisms it can sustain.", trap: "Habitat degradation reduces habitat quality, whereas fragmentation physically breaks continuous habitat into isolated patches.", covers: ["w1q4"] },
          { id: "c1-5", term: "Ecology", body: "Ecology is defined as the scientific study of relationships between organisms and their environments. It analyzes interactions among living organisms and their abiotic surroundings.", covers: ["w1q5"] },
          { id: "c1-6", term: "Liebig's Law of the Minimum", body: "Liebig's law states that the rate of any biological process is governed by the single limiting factor in least supply relative to requirement. Growth is controlled not by total resources available, but by the scarcest essential resource.", trap: "Liebig's law focuses on the single minimum factor, whereas Shelford's law of tolerance considers the entire upper and lower range of environmental tolerance.", covers: ["w1q6"] },
          { id: "c1-7", term: "Etymology of Conservation", body: "The word conservation is derived from Latin roots: 'con' meaning together, and 'servare' meaning to keep or preserve. Conservation literally means keeping things together in a preserved state.", covers: ["w1q7", "w1q8"] },
          { id: "c1-8", term: "Climatology and Migration Factors", body: "Climatology is the study of long-term atmospheric patterns and is most closely related to meteorology. In human and animal geography, a good climate acts as a pull factor that attracts populations.", trap: "A pull factor attracts individuals to a favorable region, whereas a push factor drives them away from an unfavorable area.", covers: ["w1q9", "w1q10"] }
        ],
        questions: [
          { id: "w1q1", n: 1, q: "The regular, seasonal movement of animals, often along fixed routes is called", options: ["translocation", "migration", "dispersal", "drifting"], answer: 1, why: "Migration is regular, seasonal animal movement, often along fixed routes. Dispersal is spread; translocation is human-moved." },
          { id: "w1q2", n: 2, q: "The systematic approach to Geography was developed by:", options: ["Alexander von Humboldt", "Karl Ritter", "Rene Descartes", "Eratosthenes"], answer: 0, why: "Alexander von Humboldt developed the systematic approach to geography. Karl Ritter is linked to the regional approach." },
          { id: "w1q3", n: 3, q: "I tried growing vegetables under my teak plantation, but the vegetable plants died out. I should be concerned about", options: ["autophagy", "allelophagy", "autopathy", "allelopathy"], answer: 3, why: "Allelopathy occurs when a plant (e.g. teak) releases biochemicals that inhibit the growth of neighbouring plants." },
          { id: "w1q4", n: 4, q: "A lake still exists physically, but sewage and plastic waste reduce the number of fish it can support. This is best called:", options: ["Habitat degradation", "Habitat fragmentation", "Jump dispersal", "Secular dispersal"], answer: 0, why: "Habitat degradation means the habitat still physically exists but its ecological quality declines. Fragmentation involves splitting habitat into disconnected patches." },
          { id: "w1q5", n: 5, q: "“Science of relationships between organisms and their environments” is the definition of:", options: ["conservation", "preservation", "environmentalism", "ecology"], answer: 3, why: "Ecology is the scientific study of relationships between organisms and their physical and biological environments." },
          { id: "w1q6", n: 6, q: "\"The rate of any biological process is limited by that factor in least amount relative to requirement, so there is a single limiting factor.\" This is the statement for", options: ["Liebig’s law of the minimum", "Liebig’s law of the maximum", "Shelford’s law of tolerance", "Shelford’s law of intolerance"], answer: 0, why: "Liebig's law of the minimum states that the scarcest resource relative to need limits a biological process. Shelford's law concerns the range of tolerance." },
          { id: "w1q7", n: 7, q: "In the word root for conservation, con stands for", options: ["together", "to keep", "house", "manage"], answer: 0, why: "In the Latin root for conservation, 'con' means together." },
          { id: "w1q8", n: 8, q: "In the word root for conservation, servare stands for", options: ["together", "to keep", "house", "manage"], answer: 1, why: "The Latin 'servare' means to keep or guard. Conservation literally means keeping together." },
          { id: "w1q9", n: 9, q: "The Geographical discipline of Climatology is most closely related to:", options: ["Geology", "Meteorology", "Hydrology", "Pedology"], answer: 1, why: "Climatology is most closely related to meteorology, analyzing long-term atmospheric patterns versus short-term weather." },
          { id: "w1q10", n: 10, q: "Good climate is a", options: ["chemical factor", "demographic factor", "push factor", "pull factor"], answer: 3, why: "A favorable climate is a pull factor that attracts populations to a region, unlike push factors which drive them away." }
        ]
      },
      {
        id: 2,
        title: "Earth's origin, interior, volcanoes, dating",
        bigIdea: "Earth's structure, volcanic systems, and geological history are deciphered through planetary physics, seismic waves, and stratigraphic principles. Relative and absolute dating methods allow scientists to reconstruct deep time and geological formations.",
        concepts: [
          { id: "c2-1", term: "Volcanic Types", body: "Stratovolcanoes such as Mount Fuji are steep cones composed of alternating layers of hardened lava and tephra. In contrast, shield volcanoes like those in Hawaii feature broad, gentle slopes formed by low-viscosity basaltic lava.", covers: ["w2q1", "w2q5"] },
          { id: "c2-2", term: "Mantle and Magma Generation", body: "The Earth's mantle is the primary source of magma that feeds volcanic eruptions and crustal formation. Heat and pressure within the upper mantle cause partial melting of silicate rocks.", covers: ["w2q2"] },
          { id: "c2-3", term: "Geological Dating Methods", body: "Absolute dating provides numerical ages using techniques like radioisotope dating, thermoluminescence, and fission track analysis. Inclusion study is a relative dating principle which states that rock fragments within a host rock must be older than the host rock.", trap: "Inclusion study is a relative dating technique, whereas radioisotope and fission-track dating yield absolute ages in years.", covers: ["w2q3"] },
          { id: "c2-4", term: "Planetesimals and Terrestrial Planets", body: "Planetesimals are small solid bodies formed from gas and dust in the early solar nebula that accrete to form planets. The terrestrial planets in our solar system consist of Mercury, Venus, Earth, and Mars.", covers: ["w2q4", "w2q8"] },
          { id: "c2-5", term: "Seismic P Waves", body: "Primary (P) waves are longitudinal compressional waves that represent the fastest seismic waves. Because compression can propagate through any phase of matter, P waves travel through solids, liquids, and gases.", trap: "P waves are longitudinal and move through all states of matter, while S waves are transverse and cannot pass through liquids.", covers: ["w2q6"] },
          { id: "c2-6", term: "Stratigraphic Principles", body: "The principle of fossil succession establishes that fossil assemblages succeed each other in a definite order and can age rocks across regions. The principle of lateral continuity states that sedimentary layers extend laterally in all directions until they thin out or terminate at basin edges.", covers: ["w2q7", "w2q9"] },
          { id: "c2-7", term: "Flood Basalt Provinces", body: "Flood basalt provinces, such as the Deccan Traps in western India, are extensive areas covered by successive basalt lava flows from massive fissure eruptions. They represent immense volcanic episodes during Earth's history.", covers: ["w2q10"] }
        ],
        questions: [
          { id: "w2q1", n: 1, q: "Mount Fuji is an example of", options: ["Shield volcano", "Stratovolcano", "Caldera", "Flood basalt province"], answer: 1, why: "Mount Fuji is a stratovolcano (composite cone) characterized by steep slopes of alternating hardened lava and tephra layers." },
          { id: "w2q2", n: 2, q: "The main source of magma is", options: ["Crust", "Mantle", "Outer core", "Inner core"], answer: 1, why: "Magma mainly originates from partial melting within the Earth's mantle." },
          { id: "w2q3", n: 3, q: "Which of these is not a method of absolute dating?", options: ["radioisotope dating", "thermoluminescence dating", "inclusion study", "fission track dating"], answer: 2, why: "Inclusion study is a relative dating principle (inclusions are older than host rock). Radioisotope, thermoluminescence, and fission track dating give absolute ages." },
          { id: "w2q4", n: 4, q: "What are planetesimals?", options: ["Fully formed gas giants", "Fragments of continental crust", "Small bodies formed from gas and dust that can accrete into planets", "Layers of volcanic ash within a mountain"], answer: 2, why: "Planetesimals are small solid bodies formed from nebular gas and dust that accrete over time into planets." },
          { id: "w2q5", n: 5, q: "Hawaiian volcanoes are an example of", options: ["Shield volcano", "Stratovolcano", "Caldera", "Flood basalt province"], answer: 0, why: "Hawaiian volcanoes are classic shield volcanoes built by successive layers of low-viscosity, runny basaltic lava." },
          { id: "w2q6", n: 6, q: "Which of these is true about P waves?", options: ["They are longitudinal in nature", "They are transverse in nature", "They cannot move through gases", "They cannot move through liquids"], answer: 0, why: "Primary (P) waves are longitudinal compressional waves. They travel through solids, liquids, and gases." },
          { id: "w2q7", n: 7, q: "Assemblage of fossils are unique to the time that they lived in, and so can be used to age rocks across a wide geographic distribution. This is known as", options: ["Principle of fossil succession", "Principle of original horizontality", "Principle of superposition", "Principle of cross-cutting relationships"], answer: 0, why: "The principle of fossil succession states that fossil assemblages succeed each other in a predictable order, allowing correlation across wide regions." },
          { id: "w2q8", n: 8, q: "Which set contains only terrestrial planets?", options: ["Jupiter, Saturn, Uranus, Neptune", "Earth, Jupiter, Mars, Saturn", "Mercury, Venus, Uranus, Neptune", "Mercury, Venus, Earth, Mars"], answer: 3, why: "The terrestrial (rocky inner) planets in our solar system are Mercury, Venus, Earth, and Mars." },
          { id: "w2q9", n: 9, q: "Within a depositional basin, strata are laterally continuous in all directions till the edge of the basin. This is known as", options: ["Principle of superposition", "Principle of original horizontality", "Principle of lateral continuity", "Principle of inclusions"], answer: 2, why: "The principle of lateral continuity states that layers of sediment initially extend sideways in all directions until they thin out or encounter a barrier." },
          { id: "w2q10", n: 10, q: "Deccan traps are an example of", options: ["Shield volcano", "Stratovolcano", "Caldera", "Flood basalt province"], answer: 3, why: "The Deccan Traps in India are a large flood basalt province formed by extensive fissure eruptions." }
        ]
      },
      {
        id: 3,
        title: "Minerals, rocks, weathering, landform controls",
        bigIdea: "The lithosphere is shaped by minerals, rock cycles, and weathering processes interacting with external environmental controls. Exogenic processes gradually break down and deposit materials, while endogenic forces drive internal rock formation.",
        concepts: [
          { id: "c3-1", term: "Siliciclastic Sedimentary Rocks", body: "Siliciclastic rocks are clastic non-carbonate sedimentary rocks composed predominantly of silicate minerals and rock fragments. Common examples include mudrock, composed of fine silt and clay, and sandstone, composed of sand-sized grains.", covers: ["w3q1", "w3q8"] },
          { id: "c3-2", term: "Chemical Weathering: Carbonation and Hydrolysis", body: "Chemical weathering alters mineral composition through chemical reactions. Carbonation occurs when dissolved carbon dioxide reacts with minerals such as limestone, while hydrolysis involves water reacting with minerals like feldspar to form clay.", trap: "Carbonation and hydrolysis are chemical weathering processes, whereas physical weathering involves mechanical breakdown without changing chemical composition.", covers: ["w3q2", "w3q4"] },
          { id: "c3-3", term: "Inosilicate Minerals: Amphiboles and Pyroxenes", body: "Amphiboles are dark green or black inosilicate chain minerals that typically form elongated prismatic or needle-like crystals. They differ from pyroxenes, which form shorter, stubbier crystals with different cleavage angles.", covers: ["w3q3"] },
          { id: "c3-4", term: "Exogenic vs Endogenic Processes", body: "Exogenic processes operate at or near the Earth's surface driven by solar energy and gravity, with deposition being a prime example. In contrast, volcanism, earthquakes, and plate tectonics are internal endogenic processes.", covers: ["w3q5"] },
          { id: "c3-5", term: "Mineral Identification: Streak and Cleavage", body: "Streak is the colour of a mineral in powdered form, providing a more reliable diagnostic test than surface colour because it reduces the misleading effects of minor impurities. Cleavage is the tendency of a mineral to break along specific crystallographic planes producing flat surfaces.", trap: "Cleavage produces smooth planar surfaces along internal weaknesses, whereas fracture produces irregular, uneven breaks.", covers: ["w3q6", "w3q9"] },
          { id: "c3-6", term: "Controls on Landform Development", body: "Landform evolution is governed by several external and internal factors. The stability of sea level acts as an independent control on base level, determining the ultimate limit of fluvial erosion and valley deepening.", covers: ["w3q7"] },
          { id: "c3-7", term: "Magma Cooling and Igneous Texture", body: "The cooling rate of magma determines the crystal grain size of igneous rocks. Slow cooling deep beneath the surface allows crystals ample time to grow, producing coarse-grained igneous rocks.", covers: ["w3q10"] }
        ],
        questions: [
          { id: "w3q1", n: 1, q: "Mudrock is an example of", options: ["siliciclastic rock", "carbonate rock", "evaporite rock", "phosphatic rock"], answer: 0, why: "Mudrock is a fine-grained siliciclastic sedimentary rock composed of clay- and silt-sized silicate mineral particles." },
          { id: "w3q2", n: 2, q: "Carbonation is an example of", options: ["chemical weathering", "physical weathering", "biological weathering", "none of the above"], answer: 0, why: "Carbonation is a chemical weathering process where dissolved carbon dioxide reacts with minerals such as limestone." },
          { id: "w3q3", n: 3, q: "“green or black coloured inosilicate minerals forming prism or needle-like crystals” is a description of", options: ["amphiboles", "feldspar", "mica", "pyroxene"], answer: 0, why: "Amphiboles are dark green or black inosilicate chain minerals forming prismatic to needle-like crystals. Pyroxenes are shorter and stubbier." },
          { id: "w3q4", n: 4, q: "Hydrolysis is an example of", options: ["chemical weathering", "physical weathering", "biological weathering", "none of the above"], answer: 0, why: "Hydrolysis is chemical weathering where water chemically reacts with rock-forming minerals, such as feldspar weathering into clay." },
          { id: "w3q5", n: 5, q: "Which of these is an example of exogenic process?", options: ["volcanism", "earthquake", "plate tectonics", "deposition"], answer: 3, why: "Deposition is an exogenic (surface) process driven by solar energy and gravity. Volcanism, earthquakes, and plate tectonics are internal endogenic processes." },
          { id: "w3q6", n: 6, q: "Which statement best explains why streak is often more useful than surface colour for mineral identification?", options: ["Streak measures the density of the mineral", "Surface colour never changes in minerals", "Streak shows the colour of the powdered mineral and may reduce the effect of minor impurities", "Streak reveals the age of the mineral"], answer: 2, why: "Streak reveals the true color of a powdered mineral and is consistent, whereas surface color is easily altered by minor impurities." },
          { id: "w3q7", n: 7, q: "Which factor is listed as an independent control over landform development?", options: ["Mineral streak", "Crystal habit", "Knife-blade hardness", "Stability of sea level"], answer: 3, why: "The stability of sea level (ultimate base level) serves as an independent control governing erosion and regional landform evolution." },
          { id: "w3q8", n: 8, q: "Sandstone is an example of", options: ["siliciclastic rock", "carbonate rock", "evaporite rock", "phosphatic rock"], answer: 0, why: "Sandstone is a siliciclastic sedimentary rock composed predominantly of sand-sized silicate grains." },
          { id: "w3q9", n: 9, q: "“tendency to break in given directions producing relatively plane surfaces” is known as", options: ["cleavage", "fracture", "lustre", "streak"], answer: 0, why: "Cleavage is the tendency of a crystal to split along specific crystallographic planes. Fracture produces irregular, non-planar surfaces." },
          { id: "w3q10", n: 10, q: "Slow cooling of magma results in", options: ["smooth grained sedimentary rocks", "coarse grained sedimentary rocks", "smooth grained igneous rocks", "coarse grained igneous rocks"], answer: 3, why: "Slow cooling deep underground gives mineral crystals time to grow large, yielding coarse-grained igneous rocks." }
        ]
      },
      {
        id: 4,
        title: "Atmosphere, weather and climate change",
        bigIdea: "Atmospheric structure, pressure systems, and air masses dictate climate dynamics and global weather patterns. Responses to climate change include mitigation strategies to curb emissions and adaptation actions to manage ongoing regional impacts.",
        concepts: [
          { id: "c4-1", term: "Climate Change Mitigation", body: "Mitigation refers to actions designed to limit the magnitude of climate change by reducing greenhouse gas emissions or enhancing sinks. Carbon sequestration in geological sites permanently traps carbon dioxide, serving as a primary mitigation option.", trap: "Mitigation addresses the root causes of climate change (such as reducing emissions), whereas adaptation focuses on adjusting to its impacts.", covers: ["w4q1"] },
          { id: "c4-2", term: "Isobars and Sea Level Correction", body: "Atmospheric pressure is caused by the weight of the air column above the measurement point. Because pressure decreases rapidly with altitude, observed pressure values are converted to standard sea level before drawing isobars on weather charts.", covers: ["w4q2", "w4q9"] },
          { id: "c4-3", term: "Climate Change Adaptation and Drought Response", body: "In response to recurrent droughts in protected reserves like Mudumalai, constructing artificial water holes and replenishing them via tankers is implemented as an adaptation strategy to support wildlife water availability during climate stress.", covers: ["w4q3"] },
          { id: "c4-4", term: "Genetic Banking and Resilience", body: "Surplus seed and sperm banking functions as a vital conservation adaptation option to facilitate ecological resilience. Maintaining broad genetic reservoirs ensures populations can recover and adapt after severe environmental disruptions.", covers: ["w4q4"] },
          { id: "c4-5", term: "Atmospheric Layers: Stratosphere and Mesosphere", body: "Commercial and military jet flights typically cruise in the lower stratosphere to take advantage of smooth, stable air above tropospheric storms. Higher up in the cold mesosphere, noctilucent clouds form from ice crystals clinging to meteoric dust.", covers: ["w4q5", "w4q8"] },
          { id: "c4-6", term: "Atmospheric Heat Transfer: Advection", body: "Advection is the horizontal transport of heat and atmospheric properties by moving air masses. This contrasts with vertical heat transfer through buoyant convective updrafts.", trap: "Advection transfers heat horizontally through wind, while convection transfers heat vertically through buoyant air movement.", covers: ["w4q6"] },
          { id: "c4-7", term: "Climatological Averages and Air Masses", body: "The World Meteorological Organization defines standard climate normals using a classical averaging period of 30 years. Air masses are classified by their source regions; maritime tropical (mT) air is characterized as warm and moist.", covers: ["w4q7", "w4q10"] }
        ],
        questions: [
          { id: "w4q1", n: 1, q: "Carbon sequestration in geological sites is an option for", options: ["mitigation", "adaptation", "both of these", "none of these"], answer: 0, why: "Geological carbon sequestration captures and permanently stores carbon dioxide deep underground to reduce emissions, serving as a mitigation strategy." },
          { id: "w4q2", n: 2, q: "To reduce the effect of altitude, isobars are generally drawn after converting pressure values to", options: ["surface temperature level", "cloud base level", "tropopause level", "sea level"], answer: 3, why: "Atmospheric pressure decreases rapidly with altitude; converting pressure readings to standard sea level removes elevation differences." },
          { id: "w4q3", n: 3, q: "Because of climate change, Mudumalai Tiger Reserve is suffering from frequent droughts. The management has built several artificial water holes for animals, and fills them up regularly with tankers. In the context of climate change, such an action would be called", options: ["adaptation", "mitigation", "deceleration", "maladaptation"], answer: 0, why: "In assignment solutions, providing artificial water holes and refilling them via tankers during severe droughts is classified as an adaptation measure to cope with climate stress." },
          { id: "w4q4", n: 4, q: "Surplus seed and sperm banking is an adaptation option to facilitate", options: ["resistance to climate changes", "resilience to climate changes", "response to climate changes", "none of these"], answer: 1, why: "Surplus seed and sperm banking preserves genetic diversity, enhancing the resilience of populations to recover after severe disruptions." },
          { id: "w4q5", n: 5, q: "Flights of jet planes typically occur in", options: ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], answer: 1, why: "Commercial and military jets typically cruise in the lower stratosphere to take advantage of stable air above turbulent weather." },
          { id: "w4q6", n: 6, q: "Heat movement through horizontal movement of air is called", options: ["convection", "radiation", "advection", "conduction"], answer: 2, why: "Advection is the transfer of heat and moisture through horizontal air movement. Convection is vertical movement." },
          { id: "w4q7", n: 7, q: "The classical period for taking averages for climate is", options: ["10 years", "20 years", "30 years", "40 years"], answer: 2, why: "The standard classical period established by the World Meteorological Organization for climate normals is 30 years." },
          { id: "w4q8", n: 8, q: "Noctilucent clouds are present in which layer?", options: ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], answer: 2, why: "Noctilucent (night-shining) clouds form at extremely high altitudes in the cold mesosphere." },
          { id: "w4q9", n: 9, q: "Atmospheric pressure is mainly caused by", options: ["horizontal movement of clouds", "the weight of air above the point of measurement", "absorption of ultraviolet radiation", "seasonal movement of pressure belts"], answer: 1, why: "Atmospheric pressure is the force exerted by the weight of the column of air directly above the point of measurement." },
          { id: "w4q10", n: 10, q: "Which of these air masses is generally warm and moist?", options: ["cP", "cT", "mP", "mT"], answer: 3, why: "Maritime tropical (mT) air masses originate over warm tropical oceans and are characteristically warm and moist." }
        ]
      },
      {
        id: 5,
        title: "Oceans and the hydrosphere",
        bigIdea: "Oceanic basins, physical oceanography, and hydrological cycles define marine habitats and ocean circulation. Density variations, tidal mechanics, and bathymetric divisions influence global biological productivity and nutrient transport.",
        concepts: [
          { id: "c5-1", term: "Abyssal Plains", body: "Abyssal plains are vast, nearly level plains on the deep ocean floor blanketed by thick layers of fine sediment, primarily pelagic clay and silt. Due to their immense geographic extent, abyssal plains constitute the single largest habitat on Earth.", covers: ["w5q1", "w5q2"] },
          { id: "c5-2", term: "Mid-Oceanic Ridges and Submarine Canyons", body: "Mid-oceanic ridges form continuous underwater volcanic mountain chains that constitute the longest mountain ranges on Earth. Submarine canyons are steep, deep valleys carved into continental shelves and slopes, frequently channeling sediment from shallow to deep water.", covers: ["w5q3", "w5q8"] },
          { id: "c5-3", term: "Continental Shelf Dynamics", body: "The continental shelf is a gently sloping seabed extending from the coast with a very low gradient of 0–1 degree. Shelves are among the most biologically productive marine zones because they receive ample sunlight throughout the water column and high terrestrial nutrient runoff.", covers: ["w5q4", "w5q9"] },
          { id: "c5-4", term: "Tidal Range", body: "Tidal range is defined as the vertical difference between sea level at high tide and sea level at low tide. This range fluctuates based on lunar and solar gravitational alignment and local coastline geometry.", covers: ["w5q5"] },
          { id: "c5-5", term: "Sublimation in the Hydrological Cycle", body: "Sublimation is the thermodynamic process wherein ice and snow transition directly into water vapour without melting into a liquid intermediate phase. It occurs extensively in arid, sunny, high-altitude alpine and polar environments.", covers: ["w5q6"] },
          { id: "c5-6", term: "Seawater Density and Isohalines", body: "The density of ocean water with depth is determined primarily by three interrelated factors: hydrostatic pressure, salinity, and temperature. On oceanographic charts, lines connecting points of equal salinity are termed isohaline curves.", trap: "Isohalines connect points of equal salinity, whereas isotherms connect points of equal temperature and isopycnals connect points of equal density.", covers: ["w5q7", "w5q10"] }
        ],
        questions: [
          { id: "w5q1", n: 1, q: "What type of sediment is commonly found over abyssal plains?", options: ["Coral fragments and gravel", "Basalt blocks and volcanic ash", "Sand and large pebbles", "Clay and silt"], answer: 3, why: "Abyssal plains are covered by thick blankets of fine pelagic clay and silt settled from the water column." },
          { id: "w5q2", n: 2, q: "Which of these is the largest habitat on the Earth?", options: ["continental shelf", "continental slope", "guyot", "abyssal plain"], answer: 3, why: "The abyssal plain covers vast expanses of the deep ocean floor, making it the single largest habitat on Earth." },
          { id: "w5q3", n: 3, q: "Which of these are the largest mountain ranges on Earth?", options: ["oceanic deep / trench", "mid-oceanic ridge", "seamount", "atoll"], answer: 1, why: "The mid-oceanic ridge system forms a continuous global underwater mountain chain over 65,000 km long, the largest on Earth." },
          { id: "w5q4", n: 4, q: "Which factor helps explain why continental shelves are often highly productive?", options: ["They are the deepest parts of the ocean floor", "They are completely isolated from runoff", "They receive both light and nutrients", "They lack sediments and organisms"], answer: 2, why: "Continental shelves are shallow enough to receive sunlight throughout the photic zone and receive nutrient runoff from adjacent landmasses." },
          { id: "w5q5", n: 5, q: "What is tidal range?", options: ["The horizontal movement of water parallel to the beach", "The difference between sea level at high tide and low tide", "The speed at which waves approach the coast", "The movement of cold water from deep ocean layers"], answer: 1, why: "Tidal range is the vertical difference in water height between sea level at high tide and low tide." },
          { id: "w5q6", n: 6, q: "Which process converts ice and snow directly into water vapour?", options: ["Condensation", "Precipitation", "Snowmelt", "Sublimation"], answer: 3, why: "Sublimation is the direct phase change from solid ice or snow into gaseous water vapour without melting into liquid." },
          { id: "w5q7", n: 7, q: "Which group of factors affects the density of ocean water with depth?", options: ["Runoff, tides and beach slope", "Hydrostatic pressure, salinity and temperature", "Wind speed, wave height and latitude only", "Sediment size, coral growth and river mouths"], answer: 1, why: "Ocean water density is governed by hydrostatic pressure, salinity, and water temperature." },
          { id: "w5q8", n: 8, q: "“deep valleys, often cutting across continental shelves and slopes” is a description of", options: ["oceanic deep / trench", "mid-oceanic ridge", "guyot", "submarine canyon"], answer: 3, why: "Submarine canyons are steep, narrow V-shaped valleys incised into continental shelves and continental slopes." },
          { id: "w5q9", n: 9, q: "Continental shelf has a gradient of", options: ["0-1 degree", "1-2 degree", "2-5 degree", "5-10 degree"], answer: 0, why: "Continental shelves are very gently inclined seaward platforms with an average gradient of about 0–1 degree." },
          { id: "w5q10", n: 10, q: "Equal salinity curves are called", options: ["isopycnal curves", "isohaline curves", "isotherm curves", "isobuoyant curves"], answer: 1, why: "Isohaline curves join points of equal salinity in marine bodies (isotherms = temperature, isopycnals = density)." }
        ]
      },
      {
        id: 6,
        title: "India: drainage, geology, climate",
        bigIdea: "India's physiography features distinct drainage architectures, geological formations, and climatic drivers. The contrast between ancient Peninsular hard rock systems and younger Himalayan sedimentary belts governs river morphology and monsoon patterns.",
        concepts: [
          { id: "c6-1", term: "Western Ghats as Water Divide", body: "The Western Ghats act as a primary water divide in peninsular India, separating drainage basins such that water on opposite sides flows in different directions toward the Bay of Bengal or Arabian Sea.", covers: ["w6q1"] },
          { id: "c6-2", term: "West-Flowing Rivers: Narmada and Tapi", body: "Unlike most major peninsular rivers that flow east, the Narmada and Tapi rivers flow westward through tectonic rift valleys and empty into the Arabian Sea.", covers: ["w6q6"] },
          { id: "c6-3", term: "Drainage Patterns: Accordant and Discordant", body: "Accordant drainage conforms to the structural geology and topographic slope of the land, whereas discordant drainage cuts across structural relief without conforming to current rock resistance.", trap: "Accordant drainage follows the land's structure, whereas discordant drainage does not match the landscape structure.", covers: ["w6q2", "w6q4"] },
          { id: "c6-4", term: "Dendritic Drainage Pattern", body: "Dendritic drainage is a branching, tree-like river network in which smaller tributary streams join a main channel at acute angles, typically forming over uniform geological substrate.", covers: ["w6q3"] },
          { id: "c6-5", term: "Geology of Himalayas and Peninsular Rivers", body: "The Himalayas are primarily composed of folded marine sedimentary rocks. In contrast, Peninsular rivers have fixed, stable courses because they have cut deeply into ancient, rigid crystalline rocks.", covers: ["w6q5", "w6q8"] },
          { id: "c6-6", term: "Climatic Controls and Köppen Classification", body: "India's climate is shaped by latitude, elevation, the Himalayas acting as a barrier to Siberian winds, and distance from the sea. In Köppen classification, 'F' designates polar frost climate.", trap: "In Köppen's polar system, F represents perpetual frost/ice, while T represents tundra.", covers: ["w6q7", "w6q9", "w6q10"] }
        ],
        questions: [
          { id: "w6q1", n: 1, q: "The Western Ghats act as a water divide because", options: ["they prevent all rivers from reaching the sea", "water on opposite sides flows in different directions", "they cause all rivers to become seasonal", "they convert rivers into lakes"], answer: 1, why: "A water divide separates drainage basins such that water on opposite sides flows in different directions (east toward Bay of Bengal, west toward Arabian Sea)." },
          { id: "w6q2", n: 2, q: "A river network that follows the structure and slope of the land is best described as", options: ["discordant", "antecedent", "accordant", "centripetal"], answer: 2, why: "Accordant drainage conforms to and reflects the structural geology and topographic slope of the landscape." },
          { id: "w6q3", n: 3, q: "A tree-like river network in which smaller streams join a main channel is called", options: ["trellis drainage", "dendritic drainage", "centripetal drainage", "rectangular drainage"], answer: 1, why: "Dendritic drainage exhibits a branching, tree-like pattern where tributaries join the main river at acute angles." },
          { id: "w6q4", n: 4, q: "A river system that does not match the present structure and relief of the landscape is called", options: ["discordant drainage", "dendritic drainage", "radial drainage", "parallel drainage"], answer: 0, why: "Discordant drainage cuts across geological structures and relief without correlating to current rock resistance." },
          { id: "w6q5", n: 5, q: "The Himalayas are primarily comprised of", options: ["sedimentary rocks", "igneous rocks", "metamorphic rocks", "b and c"], answer: 0, why: "The Himalayas were formed by the uplift and folding of marine sedimentary strata originally deposited in the Tethys geosyncline." },
          { id: "w6q6", n: 6, q: "Which pair of rivers is described as flowing westwards into the Arabian Sea?", options: ["Ganga and Yamuna", "Mahanadi and Godavari", "Narmada and Tapi", "Krishna and Kaveri"], answer: 2, why: "The Narmada and Tapi rivers flow westwards through rift valleys between mountain ranges and empty into the Arabian Sea." },
          { id: "w6q7", n: 7, q: "Which of these are factors determining the climate of India?", options: ["distance from the sea", "altitude", "relief", "all of these"], answer: 3, why: "India's climate is determined by distance from the ocean, elevation/altitude, and topographic relief features (all of these)." },
          { id: "w6q8", n: 8, q: "Peninsular rivers usually have fixed courses mainly because", options: ["they flow through newly formed mountains", "they carry very high sediment loads", "they are controlled only by monsoon winds", "their courses are cut into older, harder rocks"], answer: 3, why: "Peninsular rivers flow across the ancient, stable crystalline hard rock shield of the Deccan Plateau, preventing frequent course changes." },
          { id: "w6q9", n: 9, q: "In Koeppen classification, which is polar frost temperature?", options: ["c", "d", "F", "T"], answer: 2, why: "In the Köppen classification, 'F' denotes polar frost climate (perpetual ice/snow), while 'T' denotes polar tundra." },
          { id: "w6q10", n: 10, q: "Which of these are factors determining the climate of India?", options: ["the latitudinal extent", "the Himalayas forming a climatic divide", "distribution of land and water", "all of these"], answer: 3, why: "India's climate is shaped by latitudinal range, the Himalayas acting as a barrier to Siberian cold winds, and the distribution of land and water." }
        ]
      },
      {
        id: 7,
        title: "Soils, succession and biodiversity",
        bigIdea: "Soil genesis, ecological succession, and biodiversity indices reveal ecosystem resilience and structural dynamics. Disturbance regimes and weathering pathways determine community stability and pedological horizon formation.",
        concepts: [
          { id: "c7-1", term: "Arid Soils and Bangar", body: "Arid soils are sandy in texture, saline, poor in organic moisture, and characteristic of arid tracts in Rajasthan and Gujarat. Bangar represents older alluvial soil deposited above flood levels, distinct from younger floodplain khadar.", covers: ["w7q1", "w7q3"] },
          { id: "c7-2", term: "Weathering: Cryofracturing and Carbonation", body: "Cryofracturing, or frost wedging, is physical weathering where repetitive freezing and expanding of water in fissures shatters rock. Carbonation is chemical weathering caused by acidic rainwater reacting with minerals.", covers: ["w7q2", "w7q9"] },
          { id: "c7-3", term: "Biodiversity Metrics: Alpha, Beta, Gamma", body: "Alpha diversity measures the richness of species that exists locally within a single ecosystem or habitat. Gamma diversity measures overall species richness across different geographic regions or landscape scales.", trap: "Alpha diversity evaluates species richness within a single ecosystem, while gamma diversity encompasses total diversity across multiple geographies.", covers: ["w7q4", "w7q7"] },
          { id: "c7-4", term: "Ecological Succession: Catastrophic Climax", body: "A catastrophic climax occurs when an ecological climax community is established or maintained by recurring natural catastrophic disturbances, such as frequent wildfires preventing succession to a deciduous forest.", covers: ["w7q5"] },
          { id: "c7-5", term: "Intermediate Disturbance Hypothesis", body: "Species diversity is maximized at intermediate levels of disturbance. Moderate disturbances prevent aggressive competitive exclusion by dominant species while allowing pioneer and succession species to coexist.", covers: ["w7q6"] },
          { id: "c7-6", term: "Soil Profile and Soil Structure", body: "A soil profile is the complete vertical arrangement of soil horizons from surface litter down to bedrock. Soil structure describes the physical arrangement and aggregation of solid soil particles and the pore spaces between them.", trap: "Soil structure refers to how soil particles are clumped together, whereas soil texture refers to the proportion of sand, silt, and clay particles.", covers: ["w7q8", "w7q10"] }
        ],
        questions: [
          { id: "w7q1", n: 1, q: "Which soils are generally sandy, saline, low in moisture and commonly found in Rajasthan and Gujarat?", options: ["Forest soils", "Arid soils", "Peaty soils", "Red and yellow soils"], answer: 1, why: "Arid soils are sandy in texture, saline in nature, deficient in moisture and humus, and prevalent in arid parts of Rajasthan and Gujarat." },
          { id: "w7q2", n: 2, q: "Cryofracturing is an example of", options: ["chemical weathering", "physical weathering", "biological weathering", "none of the above"], answer: 1, why: "Cryofracturing (frost wedging) is mechanical/physical weathering caused by the volume expansion of freezing water in rock cracks." },
          { id: "w7q3", n: 3, q: "Bangar is a type of", options: ["black cotton soil", "alluvial soil", "saline soil", "red and yellow soil"], answer: 1, why: "Bangar represents older alluvium deposited in terraces above the annual flood plains of river systems." },
          { id: "w7q4", n: 4, q: "\"the diversity that exists within an ecosystem\" is", options: ["alpha (α) biodiversity", "beta (β) biodiversity", "gamma (γ) biodiversity", "delta (δ) biodiversity"], answer: 0, why: "Alpha (α) biodiversity is the species richness and diversity measured locally within a single community or ecosystem." },
          { id: "w7q5", n: 5, q: "A climax caused by wildfires is an example of", options: ["climatic climax", "edaphic climax", "disclimax", "catastrophic climax"], answer: 3, why: "A catastrophic climax occurs when an ecosystem is repeatedly reset and arrested by periodic catastrophic events like wildfires." },
          { id: "w7q6", n: 6, q: "For more biodiversity, the level of disturbance should be", options: ["less", "intermediate", "more", "none of these"], answer: 1, why: "Under the intermediate disturbance hypothesis, moderate disturbance frequency allows both colonizing and competitive species to coexist." },
          { id: "w7q7", n: 7, q: "\"the diversity that exists among different geographies\" is", options: ["alpha (α) biodiversity", "beta (β) biodiversity", "gamma (γ) biodiversity", "delta (δ) biodiversity"], answer: 2, why: "Gamma (γ) biodiversity is the total species diversity observed across different geographical regions or landscape units." },
          { id: "w7q8", n: 8, q: "Vertical arrangement of soil horizons is called", options: ["soil texture", "soil structure", "soil profile", "soil science"], answer: 2, why: "A soil profile is the vertical section through soil showing all of its distinct layers (horizons) from surface to bed rock." },
          { id: "w7q9", n: 9, q: "Carbonation is an example of", options: ["chemical weathering", "physical weathering", "biological weathering", "none of the above"], answer: 0, why: "Carbonation is chemical weathering resulting from carbonic acid reacting with soluble carbonate minerals." },
          { id: "w7q10", n: 10, q: "Which soil property refers to the arrangement of solid soil parts and pore spaces between them?", options: ["Soil fertility", "Soil texture", "Soil horizon", "Soil structure"], answer: 3, why: "Soil structure describes how individual sand, silt, and clay particles clump and aggregate together relative to pore spaces." }
        ]
      },
      {
        id: 8,
        title: "Conservation biology",
        bigIdea: "Conservation biology balances in-situ habitat protection with ex-situ interventions to combat extinction risks and population genetics decline. Understanding ecological roles, trophic magnification, and major threat vectors informs reserve design.",
        concepts: [
          { id: "c8-1", term: "In-situ vs Ex-situ Conservation", body: "In-situ conservation preserves species within their natural habitats, as seen in wildlife sanctuaries, national parks, and biosphere reserves. Ex-situ conservation protects organisms outside their natural environments, such as seed banks and captive breeding centres.", covers: ["w8q1"] },
          { id: "c8-2", term: "Inbreeding Depression and Restricted Range", body: "Inbreeding depression arises in small isolated populations when mating among close genetic relatives reduces fitness and expression of deleterious alleles. Species restricted to a single lake or localized habitat are vulnerable primarily due to their limited geographical range.", covers: ["w8q2", "w8q4"] },
          { id: "c8-3", term: "Ecological Roles: Keystone and Umbrella Species", body: "Keystone species exert disproportionate regulatory control over ecosystem structure relative to their numerical abundance. The Asian elephant functions simultaneously as an umbrella species (large range), keystone species (forest engineer), and flagship species (charismatic cultural icon).", covers: ["w8q3", "w8q10"] },
          { id: "c8-4", term: "Challenges of Ex-situ Conservation", body: "While ex-situ programs preserve critical germplasm, they face operational drawbacks: captive-bred individuals may struggle to adapt, forage, or avoid predators upon reintroduction to the wild.", covers: ["w8q5"] },
          { id: "c8-5", term: "Species-Area Relationship and Biomagnification", body: "In the fundamental species-area relationship, 'S' denotes total species richness. Biomagnification occurs when persistent synthetic contaminants like DDD increase in concentration at successively higher trophic feeding levels.", covers: ["w8q6", "w8q7"] },
          { id: "c8-6", term: "Reserve Prioritisation and the HIPPO Framework", body: "Conservation planning often prioritises regions where the level of human threat is medium to optimize conservation effectiveness where intervention is most needed and viable. The classic threat acronym HIPPO stands for Habitat loss, Invasive species, Pollution, Population growth, and Overharvesting.", trap: "In the HIPPO acronym, P stands for Pollution and Population, while pollination is an ecosystem service, not a threat.", covers: ["w8q8", "w8q9"] }
        ],
        questions: [
          { id: "w8q1", n: 1, q: "Which of the following is listed as an ex-situ conservation method?", options: ["Wildlife sanctuary", "National park", "Seed bank", "Biosphere reserve"], answer: 2, why: "A seed bank preserves plant germplasm off-site (ex-situ), whereas sanctuaries, national parks, and biosphere reserves protect species in their natural habitats (in-situ)." },
          { id: "w8q2", n: 2, q: "Which factor makes smaller populations especially vulnerable due to mating among close relatives?", options: ["Habitat displacement", "Eutrophication", "Inbreeding depression", "Carbon storage"], answer: 2, why: "Inbreeding depression occurs when closely related individuals mate in small populations, reducing genetic fitness and increasing recessive defects." },
          { id: "w8q3", n: 3, q: "Which type of species plays a much greater ecological role than expected from its abundance?", options: ["Umbrella species", "Flagship species", "Least concern species", "Keystone species"], answer: 3, why: "Keystone species exert strong regulatory control on the balance of an entire ecosystem disproportionate to their numerical abundance." },
          { id: "w8q4", n: 4, q: "A species found only in a single lake is rare mainly because of", options: ["high birth rate", "limited geographical range", "high adaptability", "large home range"], answer: 1, why: "Endemic species confined strictly to a single water body are inherently rare due to their extremely limited geographical range." },
          { id: "w8q5", n: 5, q: "Which of the following is a disadvantage of ex-situ conservation?", options: ["It always protects the natural habitat of the species", "Captive-bred individuals may find reintroduction difficult", "It prevents all inbreeding risks automatically", "It can be planned for all species at the same time"], answer: 1, why: "A major drawback of ex-situ conservation is that individuals bred in captivity often struggle with foraging, predator avoidance, and acclimatisation upon release." },
          { id: "w8q6", n: 6, q: "In the species-area relationship, what does “S” represent?", options: ["Size of the habitat", "Species richness", "Survival rate", "Stochastic pressure"], answer: 1, why: "In the mathematical species-area equation (S = c * A^z), 'S' denotes species richness (the number of species)." },
          { id: "w8q7", n: 7, q: "In the Clear Lake example, DDD concentration increased from water to plankton, fish, and piscivorous birds. This illustrates", options: ["ecological redundancy", "habitat selection", "biomagnification", "ex-situ management"], answer: 2, why: "Biomagnification is the progressive accumulation and concentration of persistent toxins at successively higher trophic levels." },
          { id: "w8q8", n: 8, q: "We prefer those areas for the creation of a conservation reserve where the level of threat is", options: ["very high", "medium", "very low", "non-existent"], answer: 1, why: "In systematic conservation planning, areas with medium threat levels are preferred for reserve creation because areas under low threat are already safe (low vulnerability), while high-threat areas may be too degraded; medium threat maximizes conservation return on investment." },

  <!-- SCRIPT 2: APPLICATION CODE -->
  <script>
    "use strict";

    /* 1. CONSTANTS & HELPERS */
    const STORAGE_KEY = "cg2026.v1";
    let store = {
      v: 1,
      theme: "light",
      pack: "mono",
      mode: "practice",
      lastRoute: "#/learn/1",
      mixedCount: 20,
      best: {},
      attempts: {},
      missed: []
    };

    let state = {
      route: "",
      quiz: null,
      highlightQid: null
    };

    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = a[i];
        a[i] = a[j];
        a[j] = temp;
      }
      return a;
    }

    function announce(msg) {
      const live = document.getElementById("live");
      if (live) live.textContent = msg;
    }

    function getQuestionById(qid) {
      for (const w of WEEKS) {
        for (const q of w.questions) {
          if (q.id === qid) return { q, week: w };
        }
      }
      return null;
    }

    /* 2. STORAGE */
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            store = Object.assign(store, parsed);
          }
        }
      } catch (e) {
        console.warn("Storage read failed; fallback in-memory.", e);
      }
      if (!store.pack || typeof store.pack !== "string") store.pack = "mono";
      if (!Array.isArray(store.missed)) store.missed = [];
      if (!store.best || typeof store.best !== "object") store.best = {};
      if (!store.attempts || typeof store.attempts !== "object") store.attempts = {};
      if (![10, 20, 40, 120].includes(store.mixedCount)) store.mixedCount = 20;
    }

    function saveStore() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      } catch (e) {
        console.warn("Storage write failed.", e);
      }
    }

    /* 3. DATA VALIDATION */
    function validateData() {
      const errors = [];
      if (!Array.isArray(WEEKS) || WEEKS.length !== 12) {
        errors.push(`Expected 12 weeks, got ${WEEKS ? WEEKS.length : 0}`);
      }
      const seenQids = new Set();
      const coveredQids = new Set();

      (WEEKS || []).forEach((w, wIdx) => {
        if (w.id !== wIdx + 1) errors.push(`Week index mismatch for week id ${w.id}`);
        if (!Array.isArray(w.questions) || w.questions.length !== 10) {
          errors.push(`Week ${w.id} has ${w.questions ? w.questions.length : 0} questions (expected 10)`);
        }
        (w.questions || []).forEach(q => {
          if (seenQids.has(q.id)) errors.push(`Duplicate question id: ${q.id}`);
          seenQids.add(q.id);
          if (!Array.isArray(q.options) || q.options.length !== 4) {
            errors.push(`Question ${q.id} has ${q.options ? q.options.length : 0} options (expected 4)`);
          }
          if (typeof q.answer !== "number" || q.answer < 0 || q.answer > 3) {
            errors.push(`Question ${q.id} has invalid answer index ${q.answer}`);
          }
        });
        if (!Array.isArray(w.concepts) || w.concepts.length < 5) {
          errors.push(`Week ${w.id} has insufficient concepts (${w.concepts ? w.concepts.length : 0})`);
        }
        (w.concepts || []).forEach(c => {
          if (Array.isArray(c.covers)) {
            c.covers.forEach(id => coveredQids.add(id));
          }
        });
      });

      seenQids.forEach(qid => {
        if (!coveredQids.has(qid)) {
          errors.push(`Question ${qid} is not covered by any concept card.`);
        }
      });

      coveredQids.forEach(qid => {
        if (!seenQids.has(qid)) {
          errors.push(`Concept covers references unknown question ID: ${qid}`);
        }
      });

      if (errors.length > 0) {
        console.error("Data validation failed:", errors);
        const app = document.getElementById("app");
        if (app) {
          app.innerHTML = `
            <div class="container" style="padding: 24px;">
              <div style="background: var(--wrong-tint); color: var(--wrong); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--wrong);">
                <h2 style="font-family: monospace; font-size: 1.25rem; margin-bottom: 8px;">Data Validation Error</h2>

    /* 5. TEMPLATES & VIEWS */
    function renderWeekChips(activeWeekId, currentView) {
      const container = document.getElementById("week-chips-row");
      if (!container) return;

      container.innerHTML = WEEKS.map(w => {
        const best = store.best[w.id];
        const attempts = store.attempts[w.id] || 0;
        let dotHtml = `<span class="status-dot"></span>`;
        let statusText = "not attempted";

        if (attempts > 0) {
          if (best >= 7) {
            dotHtml = `<span class="status-dot filled">${ICONS.check}</span>`;
            statusText = `best score ${best} of 10`;
          } else {
            dotHtml = `<span class="status-dot half"></span>`;
            statusText = `best score ${best !== undefined ? best : 0} of 10`;
          }
        }

        const isCurrent = (activeWeekId === w.id);
        const targetHash = currentView === "quiz" ? `#/quiz/${w.id}` : `#/learn/${w.id}`;

        return `
          <a href="${targetHash}" class="chip" ${isCurrent ? 'aria-current="page"' : ""} 
             aria-label="Week ${w.id}, ${statusText}">
            ${dotHtml}
            <span>W${w.id}</span>
          </a>
        `;
      }).join("");

      const activeChip = container.querySelector('[aria-current="page"]');
      if (activeChip) {
        const targetLeft = activeChip.offsetLeft - (container.clientWidth - activeChip.clientWidth) / 2;
        container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
      }
    }

      const best = week ? store.best[week.id] : null;
      const attempts = week ? (store.attempts[week.id] || 0) : 0;
      const statsStr = attempts > 0 ? `Best: ${best}/10 · Attempts: ${attempts}` : "Not attempted yet";

      const title = kind === "week" 
        ? `Quiz: ${week.title}`
        : (kind === "mixed" ? "Mixed Practice Quiz" : "Retry Missed Questions");

      const label = kind === "week" ? `WEEK ${weekPad} / 12` : "TEST PRACTICE";
      const missedCount = (store.missed || []).length;

            ? (store.mixedCount === 120

            : (missedCount === 0
