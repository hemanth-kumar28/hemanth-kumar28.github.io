    }

    function viewQuestion(quiz) {
      const qid = quiz.ids[quiz.idx];
      const item = getQuestionById(qid);
      if (!item) return `<div class="container"><p>Question not found.</p></div>`;

      const { q, week } = item;
      const total = quiz.ids.length;
      const currentNum = quiz.idx + 1;
      const selectedIdx = quiz.answers[qid];
      const isChecked = Boolean(quiz.checked[qid]);
      const answeredCount = Object.keys(quiz.answers).length;
      const progressPct = (answeredCount / total) * 100;

      let correctSoFar = 0;
      quiz.ids.forEach(id => {
        const it = getQuestionById(id);
        if (it && quiz.checked[id] && quiz.answers[id] === it.q.answer) {
          correctSoFar++;
        }
      });

      const isMixedOrMissed = quiz.kind !== "week";

      return `
        <div class="container quiz-column quiz-container q-card">
          <div class="quiz-progress-wrap">
            <div class="quiz-meta-row q-meta-bar">
              <span class="mono-label">Q ${currentNum} / ${total}</span>
              ${quiz.mode === "practice" ? `<span class="mono-label">${correctSoFar} correct</span>` : ""}
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="${answeredCount}" aria-valuemin="0" aria-valuemax="${total}">
              <div class="progress-fill" style="--p: ${total > 0 ? (answeredCount / total).toFixed(4) : 0};"></div>
            </div>
          </div>

          ${isMixedOrMissed ? `
            <div class="mono-label" style="color: var(--primary);">SOURCE: WEEK ${week.id} · Q${q.n}</div>
          ` : ""}

          <h2 class="question-stem q-stem" id="q-stem" tabindex="-1">${esc(q.q)}</h2>

          <div class="options-group opt-list" role="radiogroup" aria-labelledby="q-stem">
            ${q.options.map((optText, oIdx) => {
              const letter = ["A", "B", "C", "D"][oIdx];
              let optClass = "opt opt-item opt-label";
              let iconHtml = "";
              const isEliminated = quiz.eliminated && Array.isArray(quiz.eliminated[qid]) && quiz.eliminated[qid].includes(oIdx);

              if (selectedIdx === oIdx) optClass += " is-selected selected";
              if (isChecked) {
                optClass += " locked";
                if (oIdx === q.answer) {
                  if (selectedIdx === oIdx) {
                    optClass += " is-correct correct";
                    iconHtml = `<span class="opt-feedback-icon" style="color: var(--correct);">${ICONS.check}<span class="sr-only">Verified Correct</span></span>`;
                  } else {
                    optClass += " is-missed-correct";
                    iconHtml = `<span class="opt-feedback-icon" style="color: var(--correct);">${ICONS.check}<span class="sr-only">Missed Correct (Unchosen)</span></span>`;
                  }
                } else if (selectedIdx === oIdx) {
                  optClass += " is-wrong wrong";
                  iconHtml = `<span class="opt-feedback-icon" style="color: var(--wrong);">${ICONS.cross}<span class="sr-only">Verified Wrong (Chosen)</span></span>`;
                } else {
                  optClass += " dimmed";
                }
              } else {
                if (isEliminated) {
                  optClass += " is-eliminated";
                }
              }

              return `
                <label class="${optClass}" data-opt-idx="${oIdx}" style="--i: ${oIdx};" title="${!isChecked ? 'Click to select, right-click to eliminate/cross out' : ''}">
                  <input type="radio" name="opt" value="${oIdx}" class="sr-only" ${selectedIdx === oIdx ? 'checked' : ''} ${isChecked ? 'disabled' : ''}>
                  <span class="opt-key opt-badge">${letter}</span>
                  <span class="opt-text">${esc(optText)}</span>
                  <span class="opt-key-hint" aria-hidden="true">[${letter}]</span>
                  ${iconHtml}
                  ${!isChecked ? `
                    <button type="button" class="btn-eliminate-toggle" data-eliminate-idx="${oIdx}" title="Cross out / restore option (Process of elimination)" aria-label="Cross out option ${letter}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="12" x2="20" y2="12"></line></svg>
                    </button>
                  ` : ''}
                </label>
              `;
            }).join("")}</div>

          ${isChecked && quiz.mode === "practice" ? `
            <div class="explanation-panel rationale-drawer rationale is-open ${selectedIdx === q.answer ? 'is-correct' : 'is-wrong'}">
              <div>
                <div class="exp-status" style="color: ${selectedIdx === q.answer ? 'var(--correct)' : 'var(--wrong)'};">
                  ${selectedIdx === q.answer ? 'Correct' : 'Not quite'}
                </div>
                <div class="exp-answer">
                  Answer: ${["A","B","C","D"][q.answer]} — ${esc(q.options[q.answer])}
                </div>
                <p class="exp-why">${esc(q.why)}</p>
                <div>
                  <a href="#/learn/${week.id}/${q.id}" class="btn-ghost" style="font-size: 0.875rem; text-decoration: underline;">
                    Open in notes (Week ${week.id})
                  </a>
                </div>
              </div>
            </div>
          ` : ""}

          ${quiz.submitPrompt ? `
            <div style="background: var(--wrong-tint); border: 1px solid var(--wrong); padding: 16px; border-radius: var(--radius-lg); margin-bottom: 20px;">
              <p style="font-weight: 500; margin-bottom: 12px; color: var(--wrong);">
                ${total - answeredCount} unanswered question${(total - answeredCount) > 1 ? 's' : ''} — submit anyway?
              </p>
              <div style="display: flex; gap: 8px;">
                <button id="btn-cancel-submit" class="btn btn-secondary">Go back</button>
                <button id="btn-confirm-submit" class="btn btn-primary">Submit</button>
              </div>
            </div>
          ` : ""}

          <div class="quiz-action-bar">
            ${quiz.mode === "exam" && quiz.idx > 0 ? `
              <button id="btn-prev-question" class="btn btn-ghost" style="margin-right: auto;">
                ${ICONS.arrowLeft} Back
              </button>
            ` : ""}

            ${quiz.mode === "practice" ? (
              !isChecked ? `
                <button id="btn-check-answer" class="btn btn-primary" ${selectedIdx === undefined ? 'disabled' : ''}>
                  Check answer
                </button>
              ` : `
                <button id="btn-next-question" class="btn btn-primary">
                  ${currentNum === total ? 'See results' : 'Next question'} ${ICONS.arrowRight}
                </button>
              `
            ) : (
              currentNum === total ? `
                <button id="btn-submit-exam" class="btn btn-primary">
                  Submit
                </button>
              ` : `
                <button id="btn-next-question" class="btn btn-primary">
                  Next ${ICONS.arrowRight}
                </button>
              `
            )}
          </div>
        </div>
      `;
    }

    function viewResults(quiz) {
      const total = quiz.ids.length;
      let score = 0;
      const missedIds = [];
      const correctIds = [];

      quiz.ids.forEach(qid => {
        const item = getQuestionById(qid);
        if (item) {
          if (quiz.answers[qid] === item.q.answer) {
            score++;
            correctIds.push(qid);
          } else {
            missedIds.push(qid);
          }
        }
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      let verdict = "Revisit the notes first.";
      if (pct >= 90) verdict = "Excellent. You're set.";
      else if (pct >= 70) verdict = "Good. Review the misses.";
      else if (pct >= 50) verdict = "Fair. Reread the notes.";

      const circumference = 326.73;
      const strokeDash = `${(pct / 100) * circumference} ${circumference}`;

      const nextWeekId = quiz.kind === "week" && quiz.weekId < 12 ? quiz.weekId + 1 : null;

      return `
        <div class="container quiz-column">
          <section class="card hero results-hero">
            <div class="mono-label">QUIZ RESULTS</div>
            <div class="score-ring-wrap">
              <svg class="score-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-2)" stroke-width="10" />
                <circle class="score-ring-circle" cx="60" cy="60" r="52" fill="none" stroke="var(--primary)" stroke-width="10"
                        stroke-linecap="round" stroke-dasharray="${strokeDash}" style="opacity: ${pct === 0 ? 0 : 1}; --target-dashoffset: ${(1 - pct / 100) * circumference}px;" />
              </svg>
              <div class="score-ring-text">
                <span class="score-num">${score}/${total}</span>
                <span class="score-pct">${pct}%</span>
              </div>
            </div>
            ${pct === 100 ? `
              <div class="score-perfect-badge" style="margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-family: var(--font-display); color: var(--correct);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path class="score-check-path" d="M20 6L9 17l-5-5"></path>
                </svg>
                <span>Mastery: Perfect Score!</span>
              </div>
            ` : ''}
            <div class="verdict-line">${esc(verdict)}</div>
            <div class="results-actions">
              ${quiz.kind === "missed" && (store.missed || []).length === 0 ? `
                <a href="#/learn/1" class="btn btn-primary">Start Learning (Week 1) ${ICONS.arrowRight}</a>
                <button id="btn-retry-quiz" class="btn btn-secondary">Practice this set again</button>
              ` : `
                <button id="btn-retry-quiz" class="btn btn-primary">Retry quiz</button>
                ${quiz.kind === "week" ? `
                  <a href="#/learn/${quiz.weekId}" class="btn btn-secondary">Review notes</a>
                  ${nextWeekId ? `<a href="#/learn/${nextWeekId}" class="btn btn-ghost">Next week (W${nextWeekId})</a>` : ''}
                ` : `
                  <button type="button" class="btn btn-secondary" data-action="new-quiz-set" data-kind="${quiz.kind}">New ${quiz.kind} set</button>
                `}
              `}
            </div>
          </section>

          <section class="review-section">
            <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Question review</h2>

            ${missedIds.length > 0 ? `
              <div style="margin-bottom: 24px;">
                <div class="mono-label" style="color: var(--wrong); margin-bottom: 8px;">
                  MISSED QUESTIONS (${missedIds.length})
                </div>
                ${missedIds.map(qid => renderReviewItem(qid, quiz.answers[qid], true)).join("")}
              </div>
            ` : ""}

            ${correctIds.length > 0 ? `
              <div>
                <div class="mono-label" style="color: var(--correct); margin-bottom: 8px;">
                  CORRECT QUESTIONS (${correctIds.length})
                </div>
                ${correctIds.map(qid => renderReviewItem(qid, quiz.answers[qid], false)).join("")}
              </div>
            ` : ""}
          </section>
        </div>
      `;
    }

    function renderReviewItem(qid, userAnsIdx, isMissed) {
      const item = getQuestionById(qid);
      if (!item) return "";
      const { q, week } = item;
      const letters = ["A", "B", "C", "D"];

      return `
        <details class="review-details" ${isMissed ? 'open' : ''}>
          <summary class="review-summary">
            <span style="color: ${isMissed ? 'var(--wrong)' : 'var(--correct)'}; display: inline-flex;">
              ${isMissed ? ICONS.cross : ICONS.check}
            </span>
            <span class="mono-label" style="margin: 0;">W${week.id}·Q${q.n}</span>
            <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              ${esc(q.q)}
            </span>
          </summary>
          <div class="review-content">
            <div class="review-meta">QUESTION TEXT</div>
            <p style="font-weight: 500; margin-bottom: 12px;">${esc(q.q)}</p>

            ${isMissed ? `
              <div style="margin-bottom: 8px; color: var(--wrong);">
                <span class="mono-label" style="color: inherit;">YOUR ANSWER:</span>
                ${userAnsIdx !== undefined ? `${letters[userAnsIdx]} — ${esc(q.options[userAnsIdx])}` : 'Unanswered'}
              </div>
            ` : ''}

            <div style="margin-bottom: 12px; color: var(--correct);">
              <span class="mono-label" style="color: inherit;">CORRECT ANSWER:</span>
              ${letters[q.answer]} — ${esc(q.options[q.answer])}
            </div>

            <p style="margin-bottom: 12px; color: var(--ink);">${esc(q.why)}</p>

            <a href="#/learn/${week.id}/${q.id}" class="btn-ghost" style="font-size: 0.8125rem; text-decoration: underline;">
              Open in notes (Week ${week.id})
            </a>
          </div>
        </details>
      `;
    }

    /* 6. ROUTER & CONTROLLER */
    function render() {
      const hash = window.location.hash || store.lastRoute || "#/learn/1";
      state.route = hash;
      const parts = hash.replace(/^#\/?/, "").split("/");
      const view = parts[0] || "learn";
      const param1 = parts[1] || "1";
      const param2 = parts[2] || null;

      const app = document.getElementById("app");
      const navLearn = document.getElementById("nav-learn");
      const navQuiz = document.getElementById("nav-quiz");

      // Update segmented nav links & theme button icon
      updateThemeIcon();
      updateMotionIcon();

      let activeWeekId = 1;

      if (view === "learn") {
        activeWeekId = parseInt(param1, 10);
        if (isNaN(activeWeekId) || activeWeekId < 1 || activeWeekId > 12) activeWeekId = 1;

        if (navLearn) navLearn.classList.add("active");
        if (navQuiz) navQuiz.classList.remove("active");
        if (navLearn) navLearn.setAttribute("href", `#/learn/${activeWeekId}`);
        if (navQuiz) navQuiz.setAttribute("href", `#/quiz/${activeWeekId}`);

        renderWeekChips(activeWeekId, "learn");

        const week = WEEKS.find(w => w.id === activeWeekId) || WEEKS[0];
        document.title = `Learn · Week ${week.id}: ${week.title} — Conservation Geography`;
        app.innerHTML = viewLearn(week, param2);
        announce(`Week ${week.id} study notes loaded`);

        // If highlight question or concept param present
        if (param2) {
          setTimeout(() => {
            const qEl = document.getElementById(`q-${param2}`);
            if (qEl) {
              qEl.scrollIntoView({ behavior: "smooth", block: "start" });
              qEl.classList.add("highlight");
              setTimeout(() => qEl.classList.remove("highlight"), 1800);
            } else {
              const el = document.getElementById(`concept-${param2}`) || document.querySelector(`[data-covers~="${param2}"]`);
              if (el) {
                const conceptsSec = document.getElementById("week-concepts");
                if (conceptsSec) {
                  const details = conceptsSec.querySelector("details");
                  if (details && !details.open) details.open = true;
                }
                el.scrollIntoView({ behavior: "smooth", block: "start" });
                el.classList.add("highlight");
                setTimeout(() => el.classList.remove("highlight"), 1800);
              }
            }
          }, 60);
        } else {
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
        }

        store.lastRoute = `#/learn/${activeWeekId}`;
        saveStore();
        app.focus();

      } else if (view === "quiz") {
        if (navLearn) navLearn.classList.remove("active");
        if (navQuiz) navQuiz.classList.add("active");

        if (param1 === "mixed" || param1 === "missed") {
          activeWeekId = 1;
          renderWeekChips(null, "quiz");

          if (!state.quiz || state.quiz.kind !== param1) {
            document.title = `${param1 === 'mixed' ? 'Mixed Practice' : 'Retry Missed'} · Quiz — Conservation Geography`;
            app.innerHTML = viewQuizStart(param1);
            announce(`${param1} quiz start screen`);
          } else if (state.quiz.finished) {
            document.title = `Quiz Results — Conservation Geography`;
            app.innerHTML = viewResults(state.quiz);
            announce(`Quiz finished: results`);
          } else {
            document.title = `Question ${state.quiz.idx + 1} of ${state.quiz.ids.length} — Conservation Geography`;
            app.innerHTML = viewQuestion(state.quiz);
            announce(`Question ${state.quiz.idx + 1} of ${state.quiz.ids.length}`);
            const stem = document.getElementById("q-stem");
            if (stem) stem.focus();
          }
        } else {
          activeWeekId = parseInt(param1, 10);
          if (isNaN(activeWeekId) || activeWeekId < 1 || activeWeekId > 12) activeWeekId = 1;

          if (navLearn) navLearn.setAttribute("href", `#/learn/${activeWeekId}`);
          if (navQuiz) navQuiz.setAttribute("href", `#/quiz/${activeWeekId}`);

          renderWeekChips(activeWeekId, "quiz");

          if (!state.quiz || state.quiz.weekId !== activeWeekId) {
            const week = WEEKS.find(w => w.id === activeWeekId) || WEEKS[0];
            document.title = `Quiz · Week ${week.id}: ${week.title} — Conservation Geography`;
            app.innerHTML = viewQuizStart("week", activeWeekId);
            announce(`Week ${week.id} quiz start screen`);
          } else if (state.quiz.finished) {
            document.title = `Quiz Results — Conservation Geography`;
            app.innerHTML = viewResults(state.quiz);
            announce(`Quiz finished: results`);
          } else {
            document.title = `Question ${state.quiz.idx + 1} of ${state.quiz.ids.length} — Conservation Geography`;
            app.innerHTML = viewQuestion(state.quiz);
            announce(`Question ${state.quiz.idx + 1} of ${state.quiz.ids.length}`);
            const stem = document.getElementById("q-stem");
            if (stem) stem.focus();
          }
        }
        if (param1 === "mixed" || param1 === "missed") {
          store.lastRoute = `#/quiz/${param1}`;
        } else {
          store.lastRoute = `#/quiz/${activeWeekId}`;
        }
        saveStore();
        window.scrollTo(0, 0);
        app.focus();
      } else {
        window.location.hash = store.lastRoute || "#/learn/1";
        return;
      }
    }

    /* 7. QUIZ ENGINE & STATE MANAGEMENT */
    function startQuiz(kind, weekIdOrCount, reuseIds) {
      let actualReuseIds = reuseIds;
      if (Array.isArray(weekIdOrCount)) {
        actualReuseIds = weekIdOrCount;
        weekIdOrCount = undefined;
      }

      let qids = [];
      if (actualReuseIds && Array.isArray(actualReuseIds) && actualReuseIds.length > 0) {
        qids = actualReuseIds.slice();
      } else if (kind === "week") {
        const wId = typeof weekIdOrCount === "number" ? weekIdOrCount : 1;
        const week = WEEKS.find(w => w.id === wId);
        if (!week) return;
        qids = week.questions.map(q => q.id);
      } else if (kind === "mixed") {
        const allQuestions = [];
        WEEKS.forEach(w => w.questions.forEach(q => allQuestions.push(q.id)));
        const parsedCount = parseInt(weekIdOrCount, 10);
        let targetCount = (!isNaN(parsedCount) && parsedCount > 0)
          ? parsedCount
          : (parseInt(store.mixedCount, 10) || 20);
        store.mixedCount = targetCount;
        saveStore();
        const count = Math.min(targetCount, allQuestions.length);
        qids = shuffle(allQuestions).slice(0, count);
      } else if (kind === "missed") {
        if (!store.missed || store.missed.length === 0) return;
        qids = store.missed.filter(id => Boolean(getQuestionById(id)));
        if (qids.length === 0) return;
      }

      const activeWeek = kind === "week" ? (typeof weekIdOrCount === "number" ? weekIdOrCount : 1) : null;

      state.quiz = {
        kind,
        weekId: activeWeek,
        mode: store.mode || "practice",
        ids: qids,
        idx: 0,
        answers: {},
        checked: {},
        eliminated: {},
        finished: false,
        submitPrompt: false
      };

      // Resume from saved active quiz if matching session exists
      let resumed = false;
      if (!actualReuseIds && store.activeQuiz && store.activeQuiz.kind === kind &&
          (kind !== "week" || store.activeQuiz.weekId === activeWeek) &&
          Array.isArray(store.activeQuiz.ids) && store.activeQuiz.ids.length === qids.length &&
          !store.activeQuiz.finished) {
        state.quiz.ids = store.activeQuiz.ids.slice();
        state.quiz.idx = typeof store.activeQuiz.idx === "number" ? store.activeQuiz.idx : 0;
        state.quiz.answers = Object.assign({}, store.activeQuiz.answers);
        state.quiz.checked = Object.assign({}, store.activeQuiz.checked);
        state.quiz.eliminated = Object.assign({}, store.activeQuiz.eliminated);
        resumed = true;
      }

      // If starting fresh without resuming, clear any stale active quiz
      if (!resumed && store.activeQuiz) {
        delete store.activeQuiz;
        saveStore();
      }

      const targetHash = kind === "week" ? `#/quiz/${activeWeek || 1}` : `#/quiz/${kind}`;
      if (typeof window !== "undefined" && window.location && window.location.hash !== targetHash) {
        window.location.hash = targetHash;
      }
      render();
    }

    let lastRevealTimestamp = 0;

    function isReducedMotion() {
      if (typeof document === "undefined") return false;
      if (document.documentElement && document.documentElement.getAttribute("data-motion") === "reduced") return true;
      if (typeof window !== "undefined" && window.matchMedia) {
        try {
          return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
      }
      return false;
    }

    function transitionRender(callback, direction) {
      if (typeof document !== "undefined" && typeof document.startViewTransition === "function" && !isReducedMotion()) {
        try {
          if (direction) {
            document.documentElement.setAttribute("data-vt-dir", direction);
          }
          const vt = document.startViewTransition(() => {
            callback();
          });
          if (vt && typeof vt.finished !== "undefined" && typeof vt.finished.finally === "function") {
            vt.finished.finally(() => {
              document.documentElement.removeAttribute("data-vt-dir");
            });
          }
          return;
        } catch (e) {}
      }
      callback();
    }

    function triggerHaptic(type) {
      try {
        if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function" && store.vibrate !== false) {
          if (type === "correct") {
            navigator.vibrate(10);
          } else {
            navigator.vibrate([15, 30, 15]);
          }
        }
      } catch (e) {}
    }

    function toggleMotion() {
      const current = document.documentElement.getAttribute("data-motion");
      const next = current === "reduced" ? "default" : "reduced";
      if (next === "reduced") {
        document.documentElement.setAttribute("data-motion", "reduced");
      } else {
        document.documentElement.removeAttribute("data-motion");
      }
      store.motion = next;
      saveStore();
      updateMotionIcon();
      announce(`Motion set to ${next === "reduced" ? "reduced" : "normal"}`);
    }

    function updateMotionIcon() {
      const wrap = document.getElementById("motion-icon-wrap");
      if (!wrap) return;
      const isReduced = document.documentElement.getAttribute("data-motion") === "reduced";
      wrap.innerHTML = isReduced ? ICONS.motionReduced : ICONS.motionNormal;
    }

    function selectOption(optIdx) {
      if (!state.quiz || state.quiz.finished) return;
      const qid = state.quiz.ids[state.quiz.idx];
      if (state.quiz.checked[qid]) return; // locked

      // If this option was eliminated, un-eliminate it when selected
      if (state.quiz.eliminated && Array.isArray(state.quiz.eliminated[qid])) {
        state.quiz.eliminated[qid] = state.quiz.eliminated[qid].filter(x => x !== optIdx);
      }

      state.quiz.answers[qid] = optIdx;

      // Local-first persistence: save state immediately on every answer
      store.activeQuiz = {
        kind: state.quiz.kind,
        weekId: state.quiz.weekId,
        mode: state.quiz.mode,
        ids: state.quiz.ids,
        idx: state.quiz.idx,
        answers: Object.assign({}, state.quiz.answers),
        checked: Object.assign({}, state.quiz.checked),
        eliminated: Object.assign({}, state.quiz.eliminated)
      };
      saveStore();

      // In-place DOM patching to preserve focus & prevent complete re-render
      const optLabels = document.querySelectorAll(".opt-label, .opt-item");
      optLabels.forEach(lbl => {
        const idx = parseInt(lbl.getAttribute("data-opt-idx"), 10);
        const radio = lbl.querySelector('input[type="radio"]');
        if (idx === optIdx) {
          lbl.classList.add("selected", "is-selected");
          lbl.classList.remove("is-eliminated");
          if (radio) radio.checked = true;
        } else {
          lbl.classList.remove("selected", "is-selected");
          if (radio) radio.checked = false;
        }
      });

      const btnCheck = document.getElementById("btn-check-answer");
      if (btnCheck) btnCheck.removeAttribute("disabled");
      const btnNext = document.getElementById("btn-next-question");
      if (btnNext) btnNext.removeAttribute("disabled");

      // Update progress bar in-place on GPU via scaleX(--p)
      const total = state.quiz.ids.length;
      const answeredCount = Object.keys(state.quiz.answers).length;
      const progressRatio = total > 0 ? (answeredCount / total) : 0;
      const track = document.querySelector(".progress-track");
      if (track) track.setAttribute("aria-valuenow", answeredCount);
      const fill = document.querySelector(".progress-fill");
      if (fill && fill.style) {
        fill.style.setProperty("--p", progressRatio.toFixed(4));
      }
    }

    function toggleEliminate(optIdx) {
      if (!state.quiz || state.quiz.finished || isNaN(optIdx)) return;
      const qid = state.quiz.ids[state.quiz.idx];
      if (state.quiz.checked[qid]) return; // locked

      if (!state.quiz.eliminated) state.quiz.eliminated = {};
      if (!Array.isArray(state.quiz.eliminated[qid])) {
        state.quiz.eliminated[qid] = [];
      }
      const list = state.quiz.eliminated[qid];
      const pos = list.indexOf(optIdx);
      let isElim = false;
      if (pos >= 0) {
        list.splice(pos, 1);
      } else {
        list.push(optIdx);
        isElim = true;
        // If this option was previously selected, remove selection
        if (state.quiz.answers[qid] === optIdx) {
          delete state.quiz.answers[qid];
          const btnCheck = document.getElementById("btn-check-answer");
          if (btnCheck) btnCheck.setAttribute("disabled", "true");
          const btnNext = document.getElementById("btn-next-question");
          if (btnNext) btnNext.setAttribute("disabled", "true");
        }
      }

      // In-place DOM patching without scroll jump or focus loss
      const optLabels = document.querySelectorAll(".opt-label, .opt-item");
      optLabels.forEach(lbl => {
        const idx = parseInt(lbl.getAttribute("data-opt-idx"), 10);
        if (idx === optIdx) {
          if (isElim) {
            lbl.classList.add("is-eliminated");
            lbl.classList.remove("selected", "is-selected");
            const radio = lbl.querySelector('input[type="radio"]');
            if (radio) radio.checked = false;
          } else {
            lbl.classList.remove("is-eliminated");
          }
        }
      });

      // Update progress bar in-place
      const total = state.quiz.ids.length;
      const answeredCount = Object.keys(state.quiz.answers).length;
      const progressRatio = total > 0 ? (answeredCount / total) : 0;
      const track = document.querySelector(".progress-track");
      if (track) track.setAttribute("aria-valuenow", answeredCount);
      const fill = document.querySelector(".progress-fill");
      if (fill && fill.style) {
        fill.style.setProperty("--p", progressRatio.toFixed(4));
      }
    }

    function checkAnswer() {
      if (!state.quiz) return;
      const qid = state.quiz.ids[state.quiz.idx];
      if (state.quiz.answers[qid] === undefined) return;

      state.quiz.checked[qid] = true;
      lastRevealTimestamp = Date.now();

      const item = getQuestionById(qid);
      const isCorrect = item && (state.quiz.answers[qid] === item.q.answer);

      // Haptic feedback (Android only)
      triggerHaptic(isCorrect ? "correct" : "wrong");

      // Screen reader announcement via aria-live
      if (item) {
        const letter = ["A", "B", "C", "D"][item.q.answer];
        const ansText = item.q.options[item.q.answer];
        const msg = isCorrect
          ? `Correct! The answer is ${letter}: ${ansText}.`
          : `Not quite, the correct answer is ${letter}: ${ansText}.`;
        announce(msg);
      }

      // Save progress immediately
      store.activeQuiz = {
        kind: state.quiz.kind,
        weekId: state.quiz.weekId,
        mode: state.quiz.mode,
        ids: state.quiz.ids,
        idx: state.quiz.idx,
        answers: Object.assign({}, state.quiz.answers),
        checked: Object.assign({}, state.quiz.checked),
        eliminated: Object.assign({}, state.quiz.eliminated)
      };
      saveStore();

      render();

      // Mobile: scroll rationale into view with block: "nearest" if it opens below fold
      setTimeout(() => {
        const exp = document.querySelector(".explanation-panel, .rationale-drawer");
        if (exp && typeof exp.scrollIntoView === "function") {
          exp.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }, 220);
    }

    function nextQuestion() {
      if (!state.quiz) return;
      if (state.quiz.idx + 1 < state.quiz.ids.length) {
        state.quiz.idx++;
        if (store.activeQuiz) {
          store.activeQuiz.idx = state.quiz.idx;
          saveStore();
        }
        transitionRender(() => {
          render();
          const stem = document.getElementById("q-stem");
          if (stem && typeof stem.focus === "function") stem.focus();
        }, "next");
      } else {
        finishQuiz();
      }
    }

    function prevQuestion() {
      if (!state.quiz || state.quiz.idx === 0) return;
      state.quiz.idx--;
      state.quiz.submitPrompt = false;
      if (store.activeQuiz) {
        store.activeQuiz.idx = state.quiz.idx;
        saveStore();
      }
      transitionRender(() => {
        render();
        const stem = document.getElementById("q-stem");
        if (stem && typeof stem.focus === "function") stem.focus();
      }, "prev");
    }

    function promptExamSubmit() {
      if (!state.quiz) return;
      const answered = Object.keys(state.quiz.answers).length;
      if (answered < state.quiz.ids.length) {
        state.quiz.submitPrompt = true;
        render();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      if (!state.quiz) return;
      state.quiz.finished = true;
      state.quiz.submitPrompt = false;
      delete store.activeQuiz;

      let score = 0;
      state.quiz.ids.forEach(qid => {
        const item = getQuestionById(qid);
        if (item) {
          const isCorrect = (state.quiz.answers[qid] === item.q.answer);
          if (isCorrect) {
            score++;
            // Remove from missed
            store.missed = store.missed.filter(id => id !== qid);
          } else {
            // Add to missed if not already present
            if (!store.missed.includes(qid)) {
              store.missed.push(qid);
            }
          }
        }
      });

      if (state.quiz.kind === "week") {
        const wId = state.quiz.weekId;
        store.attempts[wId] = (store.attempts[wId] || 0) + 1;
        store.best[wId] = Math.max(store.best[wId] || 0, score);
      }

      saveStore();

      if (score === state.quiz.ids.length && score > 0 && !isReducedMotion()) {
        triggerConfetti();
      }

      render();
    }

    function triggerConfetti() {
      if (typeof document === "undefined" || isReducedMotion()) return;
      try {
        const container = document.createElement("div");
        container.className = "confetti-container";
        container.setAttribute("aria-hidden", "true");
        const colors = ["#166534", "#4ADE80", "#0284C7", "#38BDF8", "#FBBF24", "#F4F4F5"];
        for (let i = 0; i < 35; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";
          piece.style.left = (Math.random() * 100) + "vw";
          piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDelay = (Math.random() * 0.5) + "s";
          piece.style.animationDuration = (1.5 + Math.random() * 1.0) + "s";
          container.appendChild(piece);
        }
        document.body.appendChild(container);
        setTimeout(() => {
          if (container.parentNode) container.parentNode.removeChild(container);
        }, 2800);
      } catch (e) {}
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "dark" ? "light" : "dark";

      const applyTheme = () => {
        document.documentElement.setAttribute("data-theme", next);
        store.theme = next;
        saveStore();
        updateThemeIcon();

        const isDark = next === "dark";
        const pack = document.documentElement.getAttribute("data-pack") || (store && store.pack) || "mono";
        const metaColors = {
          mono: isDark ? "#09090B" : "#FAFAFA",
          slate: isDark ? "#0B0F17" : "#F8FAFC",
          sage: isDark ? "#0B110D" : "#F7F8F7",
          moss: isDark ? "#0B110D" : "#F7F8F7",
          graphite: isDark ? "#0C0C0C" : "#F5F5F5"
        };
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", metaColors[pack] || (isDark ? "#09090B" : "#FAFAFA"));
        announce(`Switched to ${next} theme`);
      };

      if (typeof document !== "undefined" && typeof document.startViewTransition === "function" && !isReducedMotion()) {
        try {
          document.startViewTransition(applyTheme);
          return;
        } catch (e) {}
      }
      applyTheme();
    }

    function updateThemeIcon() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const wrap = document.getElementById("theme-icon-wrap");
      if (wrap) {
        wrap.innerHTML = current === "dark" ? ICONS.sun : ICONS.moon;
      }
    }

    /* 8. EVENT LISTENERS & DELEGATION */
    document.addEventListener("click", function(e) {
      // Skip link activation
      const skipLink = e.target.closest(".skip-link");
      if (skipLink) {
        e.preventDefault();
        const app = document.getElementById("app");
        if (app) {
          app.focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        return;
      }

      // New quiz set button on results page
      const newSetBtn = e.target.closest('[data-action="new-quiz-set"]');
      if (newSetBtn) {
        state.quiz = null;
        render();
        return;
      }

      // Theme toggle
      const themeBtn = e.target.closest("#theme-btn");
      if (themeBtn) {
        toggleTheme();
        return;
      }

      // Motion toggle
      const motionBtn = e.target.closest("#motion-btn");
      if (motionBtn) {
        toggleMotion();
        return;
      }

      // Close shortcuts dialog button
      const closeShortcuts = e.target.closest("#btn-close-shortcuts");
      if (closeShortcuts) {
        const dlg = document.getElementById("shortcuts-dialog");
        if (dlg && typeof dlg.close === "function") dlg.close();
        return;
      }

      // Backdrop click on shortcuts dialog
      if (e.target && e.target.id === "shortcuts-dialog" && typeof e.target.close === "function") {
        e.target.close();
        return;
      }

      // Back to top FAB
      if (e.target.closest("#btn-back-to-top")) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      // Jump to question, concept, or section
      const jumpEl = e.target.closest("[data-jump-to]");
      if (jumpEl) {
        e.preventDefault();
        const targetId = jumpEl.getAttribute("data-jump-to");
        if (targetId === "week-concepts" || targetId.startsWith("concept-")) {
          const conceptsSec = document.getElementById("week-concepts");
          if (conceptsSec) {
            const details = conceptsSec.querySelector("details");
            if (details && !details.open) details.open = true;
          }
        }
        const el = document.getElementById(targetId);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "start" });
          el.classList.add("highlight");
          setTimeout(() => el.classList.remove("highlight"), 1800);
        }
        return;
      }

      // Quiz mode radio cards on start screen
      const modeCard = e.target.closest("[data-set-mode]");
      if (modeCard) {
        const mode = modeCard.getAttribute("data-set-mode");
        store.mode = mode;
        saveStore();
        document.querySelectorAll("[data-set-mode]").forEach(card => {
          const isSel = card.getAttribute("data-set-mode") === mode;
          card.classList.toggle("selected", isSel);
          card.setAttribute("aria-checked", isSel ? "true" : "false");
        });
        return;
      }

      // Mixed count buttons
      const countBtn = e.target.closest("[data-set-count]");
      if (countBtn) {
        const cnt = parseInt(countBtn.getAttribute("data-set-count"), 10);
        store.mixedCount = cnt;
        saveStore();
        document.querySelectorAll("[data-set-count]").forEach(btn => {
          btn.classList.toggle("active", parseInt(btn.getAttribute("data-set-count"), 10) === cnt);
        });

        // Synchronize hero description if on mixed quiz start screen
        const descEl = document.getElementById("quiz-start-desc");
        if (descEl && (!state.route || state.route.includes("/quiz/mixed"))) {
          descEl.textContent = cnt === 120
            ? "All 120 questions drawn from across all 12 course weeks in a random mixed order."
            : `Random sample of ${cnt} questions drawn from all 12 course weeks.`;
        }

        const startBtn = document.getElementById("btn-start-quiz");
        const restartBtn = document.getElementById("btn-restart-quiz");
        const hasMatchingActive = Boolean(
          store.activeQuiz &&
          store.activeQuiz.kind === "mixed" &&
          Array.isArray(store.activeQuiz.ids) &&
          store.activeQuiz.ids.length === cnt &&
          !store.activeQuiz.finished
        );

        if (startBtn && startBtn.getAttribute("data-start-kind") === "mixed") {
          startBtn.setAttribute("data-start-count", String(cnt));
          if (hasMatchingActive) {
            const aIdx = typeof store.activeQuiz.idx === "number" ? store.activeQuiz.idx : 0;
            startBtn.innerHTML = `Resume Quiz (Q${aIdx + 1} of ${cnt}) ${ICONS.arrowRight}`;
          } else {
            startBtn.innerHTML = `Start Quiz ${ICONS.arrowRight}`;
          }
        }

        if (restartBtn && restartBtn.getAttribute("data-start-kind") === "mixed") {
          restartBtn.setAttribute("data-start-count", String(cnt));
          restartBtn.style.display = hasMatchingActive ? "" : "none";
        }
        return;
      }

      // Start quiz button
      const startBtn = e.target.closest("#btn-start-quiz");
      if (startBtn) {
        const kind = startBtn.getAttribute("data-start-kind");
        if (kind === "mixed") {
          const count = parseInt(startBtn.getAttribute("data-start-count") || store.mixedCount || 20, 10);
          startQuiz(kind, count);
        } else {
          const week = parseInt(startBtn.getAttribute("data-start-week"), 10);
          startQuiz(kind, week);
        }
        return;
      }

      // Restart quiz from Q1 button
      const restartBtn = e.target.closest("#btn-restart-quiz");
      if (restartBtn) {
        const kind = restartBtn.getAttribute("data-start-kind");
        if (store.activeQuiz && store.activeQuiz.kind === kind) {
          delete store.activeQuiz;
          saveStore();
        }
        if (kind === "mixed") {
          const count = parseInt(restartBtn.getAttribute("data-start-count") || store.mixedCount || 20, 10);
          startQuiz(kind, count);
        } else {
          const week = parseInt(restartBtn.getAttribute("data-start-week"), 10);
          startQuiz(kind, week);
        }
        return;
      }

      // Eliminate toggle button clicked
      const elimBtn = e.target.closest("[data-eliminate-idx]");
      if (elimBtn) {
        e.preventDefault();
        e.stopPropagation();
        const oIdx = parseInt(elimBtn.getAttribute("data-eliminate-idx"), 10);
        toggleEliminate(oIdx);
        return;
      }

      // Option label clicked
      const optLbl = e.target.closest(".opt-label, .opt-item");
      if (optLbl && state.quiz && !state.quiz.finished && !optLbl.classList.contains("locked") && optLbl.hasAttribute("data-opt-idx")) {
        const oIdx = parseInt(optLbl.getAttribute("data-opt-idx"), 10);
        if (!isNaN(oIdx)) {
          selectOption(oIdx);
        }
        return;
      }

      // Quiz actions
      if (e.target.closest("#btn-check-answer")) {
        checkAnswer();
        return;
      }
      if (e.target.closest("#btn-next-question")) {
        // Tap-through guard: ignore tap within 300ms of answer reveal in practice mode
        if (state.quiz && state.quiz.mode === "practice" && Date.now() - lastRevealTimestamp < 300) {
          return;
        }
        nextQuestion();
        return;
      }
      if (e.target.closest("#btn-prev-question")) {
        prevQuestion();
        return;
      }
      if (e.target.closest("#btn-submit-exam")) {
        promptExamSubmit();
        return;
      }
      if (e.target.closest("#btn-confirm-submit")) {
        finishQuiz();
        return;
      }
      if (e.target.closest("#btn-cancel-submit")) {
        if (state.quiz) {
          state.quiz.submitPrompt = false;
          render();
        }
        return;
      }
      if (e.target.closest("#btn-retry-quiz")) {
        if (state.quiz) {
          if (state.quiz.kind === "missed" && (!store.missed || store.missed.length === 0)) {
            startQuiz("missed", null, state.quiz.ids);
          } else if (state.quiz.kind === "mixed") {
            startQuiz("mixed", state.quiz.ids.length, state.quiz.ids);
          } else {
            startQuiz(state.quiz.kind, state.quiz.weekId);
          }
        }
        return;
      }
    });

    // Back to top button scroll listener
    window.addEventListener("scroll", function() {
      const fab = document.getElementById("btn-back-to-top");
      if (fab) {
        if (window.scrollY > 350) {
          fab.classList.add("visible");
        } else {
          fab.classList.remove("visible");
        }
      }
    }, { passive: true });

    // Touch Swipe Navigation for Mobile Week-to-Week Paging
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener("touchstart", function(e) {
      if (e.touches.length !== 1) return;
      if (e.target.closest(".week-scroll, .learn-jump-scroll, .seg-control, .mobile-bottom-bar")) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener("touchend", function(e) {
      if (e.changedTouches.length !== 1 || !touchStartTime) return;
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (elapsed < 600 && Math.abs(deltaX) > 60 && Math.abs(deltaY) < 60) {
        const hash = window.location.hash || store.lastRoute || "#/learn/1";
        const parts = hash.replace(/^#\/?/, "").split("/");
        const view = parts[0] || "learn";
        const weekId = parseInt(parts[1] || "1", 10);

        if (view === "learn" && !isNaN(weekId)) {
          if (deltaX < 0 && weekId < 12) {
            window.location.hash = `#/learn/${weekId + 1}`;
          } else if (deltaX > 0 && weekId > 1) {
            window.location.hash = `#/learn/${weekId - 1}`;
          }
        }
      }
      touchStartTime = 0;
    }, { passive: true });

    // Right-click on options to toggle Process of Elimination
    document.addEventListener("contextmenu", function(e) {
      const optLbl = e.target.closest(".opt-label, .opt-item");
      if (optLbl && state.quiz && !state.quiz.finished) {
        const qid = state.quiz.ids[state.quiz.idx];
        if (!state.quiz.checked[qid]) {
          e.preventDefault();
          const oIdx = parseInt(optLbl.getAttribute("data-opt-idx"), 10);
          if (!isNaN(oIdx)) {
            toggleEliminate(oIdx);
          }
        }
      }
    });

    // Keyboard Shortcuts
    document.addEventListener("keydown", function(e) {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.target && ((e.target.tagName === "INPUT" && e.target.type !== "radio" && e.target.type !== "checkbox") || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) return;

      // ? key to toggle shortcuts modal
      if (e.key === "?") {
        e.preventDefault();
        const dlg = document.getElementById("shortcuts-dialog");
        if (dlg) {
          if (dlg.open && typeof dlg.close === "function") {
            dlg.close();
          } else if (typeof dlg.showModal === "function") {
            dlg.showModal();
          }
        }
        return;
      }

      if (e.shiftKey) return;

      // Escape key to dismiss shortcuts dialog or submit prompt
      if (e.key === "Escape") {
        const dlg = document.getElementById("shortcuts-dialog");
        if (dlg && dlg.open && typeof dlg.close === "function") {
          e.preventDefault();
          dlg.close();
          return;
        }
        if (state.quiz && state.quiz.submitPrompt) {
          e.preventDefault();
          state.quiz.submitPrompt = false;
          render();
          return;
        }
      }

      // Learn mode week navigation
      if (!state.quiz && window.location.hash.includes("/learn/")) {
        const parts = (window.location.hash || "").replace(/^#\/?/, "").split("/");
        const wId = parseInt(parts[1] || "1", 10);
        if (e.key === "ArrowRight" && wId < 12) {
          e.preventDefault();
          window.location.hash = `#/learn/${wId + 1}`;
          return;
        }
        if (e.key === "ArrowLeft" && wId > 1) {
          e.preventDefault();
          window.location.hash = `#/learn/${wId - 1}`;
          return;
        }
      }

      if (!state.quiz || state.quiz.finished) return;

      const qid = state.quiz.ids[state.quiz.idx];
      const isChecked = Boolean(state.quiz.checked[qid]);

      // A-D or 1-4 option selection
      const keyMap = {
        'a': 0, 'A': 0, '1': 0,
        'b': 1, 'B': 1, '2': 1,
        'c': 2, 'C': 2, '3': 2,
        'd': 3, 'D': 3, '4': 3
      };

      if (!isChecked && keyMap[e.key] !== undefined) {
        e.preventDefault();
        selectOption(keyMap[e.key]);
        return;
      }

      // Enter key for primary progression
      if (e.key === "Enter") {
        if (e.target && e.target.closest("button, a, input:not([type='radio']):not([type='checkbox']), select, textarea, summary")) {
          // Allow focused interactive element to execute its native button / anchor activation
          return;
        }
        if (state.quiz.submitPrompt) {
          e.preventDefault();
          finishQuiz();
          return;
        }
        if (state.quiz.mode === "practice") {
          if (!isChecked) {
            if (state.quiz.answers[qid] !== undefined) {
              e.preventDefault();
              checkAnswer();
            }
          } else {
            e.preventDefault();
            nextQuestion();
          }
        } else {
          // Exam mode: allow advancement or prompt submission
          if (state.quiz.idx + 1 === state.quiz.ids.length) {
            e.preventDefault();
            promptExamSubmit();
          } else {
            e.preventDefault();
            nextQuestion();
          }
        }
        return;
      }

      // ArrowRight for next question when allowed in quiz
      if (e.key === "ArrowRight") {
        if (state.quiz.mode === "practice" && isChecked) {
          e.preventDefault();
          nextQuestion();
        } else if (state.quiz.mode === "exam" && state.quiz.idx + 1 < state.quiz.ids.length) {
          e.preventDefault();
          nextQuestion();
        }
        return;
      }

      // ArrowLeft for back in exam mode
      if (e.key === "ArrowLeft" && state.quiz.mode === "exam" && state.quiz.idx > 0) {
        e.preventDefault();
        prevQuestion();
        return;
      }
    });

    // Hash navigation listener
    window.addEventListener("hashchange", function() {
      const hash = window.location.hash || store.lastRoute || "#/learn/1";
      const parts = hash.replace(/^#\/?/, "").split("/");
      const view = parts[0] || "learn";
      if (view !== "quiz" && state.quiz) {
        state.quiz = null;
      }
      render();
    });

    /* 9. BOOTSTRAP */
    function init() {
      loadStore();
      if (store.theme) {
        document.documentElement.setAttribute("data-theme", store.theme);
      }
      if (store.pack && store.pack !== "mono") {
        document.documentElement.setAttribute("data-pack", store.pack);
      }
      if (store.motion === "reduced") {
        document.documentElement.setAttribute("data-motion", "reduced");
      }
      if (!validateData()) return;

      if (!window.location.hash) {
        window.location.hash = store.lastRoute || "#/learn/1";
      } else {
        render();
      }
    }

    init();
  </script>
</body>
</html>
