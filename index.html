    * { box-sizing: border-box; }

    body {

    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .stagger > * { animation: card-in var(--md-motion-long) var(--md-motion-ease-emphasized) both; }
    .stagger > *:nth-child(2) { animation-delay: 45ms; }

    .card, .surface-card {

    }
    .card { padding: 1.25rem; }

    .card.interactive, .surface-card.interactive { cursor: pointer; transition: transform var(--md-motion-short) var(--md-motion-ease-standard), background var(--md-motion-medium) var(--md-motion-ease-standard), box-shadow var(--md-motion-medium) var(--md-motion-ease-standard); }
    .card.interactive:hover, .surface-card.interactive:hover { transform: translateY(-2px); background: linear-gradient(rgba(208,188,255,.08), rgba(208,188,255,.08)), var(--md-surface-container-low); box-shadow: var(--md-elevation-2); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }

    .row { display: flex; align-items: center; gap: .75rem; }

    .wrap { flex-wrap: wrap; }

    .btn { min-height: 2.5rem; padding: 0 1rem; border: 0; border-radius: var(--md-radius-full); display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-size: .875rem; font-weight: 500; transition: transform var(--md-motion-short) var(--md-motion-ease-standard), background var(--md-motion-medium) var(--md-motion-ease-standard), box-shadow var(--md-motion-medium) var(--md-motion-ease-standard), color var(--md-motion-medium) var(--md-motion-ease-standard); }
    .btn:active { transform: scale(.97); }

    .icon-btn { position: relative; overflow: hidden; width: 2.5rem; height: 2.5rem; padding: 0; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--md-on-surface-variant); transition: background var(--md-motion-medium) var(--md-motion-ease-standard), color var(--md-motion-medium) var(--md-motion-ease-standard), transform var(--md-motion-short) var(--md-motion-ease-standard); }

    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, .8fr); gap: 1rem; margin-bottom: 1rem; }

        return `<section class="section-panel"><div class="page-heading"><span class="eyebrow">Your learning map</span><h1>Subjects</h1><p>Give every area a color, a weekly intention, and a little room to grow.</p></div><div class="toolbar"><div class="filter-chips"><span class="chip active">${state.subjects.length} subjects</span><span class="chip">${escapeHtml(fmtMinutes(weekMinutes()))} this week</span></div><button class="btn btn-filled" data-action="open-modal" data-modal="subject" data-ripple>${icons('plus')}Add subject</button></div><div class="subject-grid stagger">${state.subjects.map(subject => { const p = subjectProgress(subject); return `<article class="card subject-card"><div class="subject-card-head">${subjectIcon(subject)}<div><h3>${escapeHtml(subject.name)}</h3><p>${escapeHtml(subject.target)}h weekly target</p></div><div class="row-actions"><button class="icon-btn" aria-label="Edit ${escapeHtml(subject.name)}" data-action="edit-subject" data-id="${subject.id}" data-ripple>${icons('edit')}</button><button class="icon-btn" aria-label="Delete ${escapeHtml(subject.name)}" data-action="delete-subject" data-id="${subject.id}" data-ripple>${icons('delete')}</button></div></div><div><div class="target-row"><strong>${escapeHtml(fmtMinutes(p.mins))}</strong><span>${Math.round(p.percent)}% of weekly target</span></div><div class="progress"><span style="width:${p.percent}%;--progress-color:${escapeHtml(subject.color)}"></span></div></div><div class="row-between"><span class="body-sm muted">${state.sessions.filter(session => session.subjectId === subject.id).length} total sessions</span><button class="btn btn-text" data-action="open-modal" data-modal="session" data-subject="${subject.id}" data-ripple>Log time ${icons('chevron')}</button></div></article>`; }).join('')}</div></section>`;
      }

      function renderBarChart() {
        const start = startOfWeek(todayKey()); const values = Array.from({length:7}, (_, index) => minutesOn(addDays(start, index))); const max = Math.max(60, ...values); const width = 720, height = 240, left = 40, right = 18, top = 16, bottom = 35, chartHeight = height - top - bottom, chartWidth = width - left - right, gap = 16, barWidth = (chartWidth - gap * 6) / 7;
        const grid = [0, .25, .5, .75, 1].map(ratio => { const y = top + chartHeight - chartHeight * ratio; return `<line class="gridline" x1="${left}" x2="${width-right}" y1="${y}" y2="${y}"></line><text x="${left-8}" y="${y+4}" text-anchor="end">${Math.round(max*ratio/60)}h</text>`; }).join('');
        const bars = values.map((value, index) => { const h = value / max * chartHeight; const x = left + index * (barWidth + gap); const y = top + chartHeight - h; return `<rect class="bar" x="${x}" y="${y}" width="${barWidth}" height="${Math.max(4,h)}" rx="${Math.min(10,barWidth/3)}"><title>${escapeHtml(fmtDate(addDays(start,index), {weekday:'long'}))}: ${escapeHtml(fmtMinutes(value))}</title></rect><text x="${x+barWidth/2}" y="${height-10}" text-anchor="middle">${fromKey(addDays(start,index)).toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)}</text>`; }).join('');
        return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Bar chart of study hours for the current week">${grid}<line class="axis" x1="${left}" x2="${width-right}" y1="${top+chartHeight}" y2="${top+chartHeight}"></line>${bars}</svg>`;
      }
      function renderHeatmap() {
        const end = todayKey(); const start = addDays(end, -90); const cell = 14, gap = 4, left = 34, top = 18, width = 13 * (cell + gap) + left, height = 7 * (cell + gap) + top + 6; let cells = ''; for (let week = 0; week < 13; week++) { for (let day = 0; day < 7; day++) { const key = addDays(start, week * 7 + day); const minutes = minutesOn(key); const level = minutes >= 90 ? 4 : minutes >= 60 ? 3 : minutes >= 30 ? 2 : minutes > 0 ? 1 : 0; const x = left + week * (cell + gap); const y = top + day * (cell + gap); cells += `<rect class="heatmap-cell-svg" data-level="${level}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3"><title>${escapeHtml(fmtDate(key,{month:'short',day:'numeric'}))}: ${escapeHtml(fmtMinutes(minutes))}</title></rect>`; } } const labels = ['M','W','F','S'].map((label,index) => `<text x="0" y="${top + [0,2,4,6][index]*(cell+gap)+11}">${label}</text>`).join(''); return `<svg class="heatmap-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Study activity heatmap for the last 13 weeks">${labels}${cells}</svg>`;
      }
      function renderDonut() {
        const totals = state.subjects.map(subject => ({subject, mins: state.sessions.filter(session => session.subjectId === subject.id).reduce((sum, session) => sum + Number(session.duration || 0), 0)})).filter(item => item.mins > 0).sort((a,b) => b.mins - a.mins); const total = totals.reduce((sum,item) => sum + item.mins, 0) || 1; const radius = 70, circumference = 2 * Math.PI * radius; let offset = 0; const paletteColors = ['#d0bcff','#9edec5','#f3c66b','#f4b8ce','#9ccaff','#b9d7ff']; const circles = totals.map((item,index) => { const length = item.mins / total * circumference; const circle = `<circle cx="100" cy="100" r="${radius}" fill="none" stroke="${paletteColors[index % paletteColors.length]}" stroke-width="26" stroke-dasharray="${length} ${circumference-length}" stroke-dashoffset="${-offset}"><title>${escapeHtml(item.subject.name)}: ${escapeHtml(fmtMinutes(item.mins))}</title></circle>`; offset += length; return circle; }).join(''); const legend = totals.slice(0,6).map((item,index) => `<div class="legend-item"><i class="legend-dot" style="background:${paletteColors[index % paletteColors.length]}"></i><span>${escapeHtml(item.subject.name)}</span><strong>${Math.round(item.mins/total*100)}%</strong></div>`).join(''); return `<div class="donut-layout"><div class="donut-wrap"><svg width="220" height="220" viewBox="0 0 200 200" role="img" aria-label="Donut chart of time by subject"><circle cx="100" cy="100" r="${radius}" fill="none" stroke="var(--md-surface-container-highest)" stroke-width="26"></circle>${circles}</svg><div class="donut-center"><strong>${escapeHtml(fmtHours(total))}h</strong><span>all time</span></div></div><div class="legend-list">${legend || '<span class="muted body-sm">Log sessions to see your subject mix.</span>'}</div></div>`;
      }
      function renderTrend() {
        const currentStart = startOfWeek(todayKey()); const values = Array.from({length:8}, (_, index) => { const start = addDays(currentStart, (index - 7) * 7); return minutesBetween(start, addDays(start,6)); }); const max = Math.max(60, ...values); const width = 720, height = 220, left = 38, right = 22, top = 18, bottom = 30, usableW = width-left-right, usableH = height-top-bottom; const points = values.map((value,index) => `${left + (index/(values.length-1))*usableW},${top + usableH - value/max*usableH}`).join(' '); const area = `${left},${top+usableH} ${points} ${left+usableW},${top+usableH}`; const labels = values.map((value,index) => { const x = left + (index/(values.length-1))*usableW; const start = addDays(currentStart, (index - 7) * 7); return `<text x="${x}" y="${height-8}" text-anchor="middle">${fromKey(start).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><circle cx="${x}" cy="${top + usableH - value/max*usableH}" r="4" fill="var(--md-primary)"><title>Week of ${escapeHtml(fmtDate(start))}: ${escapeHtml(fmtMinutes(value))}</title></circle>`; }).join(''); return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Trend line for study time across the last eight weeks"><defs><linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d0bcff" stop-opacity=".28"></stop><stop offset="1" stop-color="#d0bcff" stop-opacity="0"></stop></linearGradient></defs><polygon points="${area}" fill="url(#trendFill)"></polygon><polyline points="${points}" fill="none" stroke="var(--md-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>${labels}</svg>`; }
      function renderAnalytics() {
        const total = totalMinutes(); const avg = state.sessions.length ? Math.round(total / state.sessions.length) : 0; const best = Math.max(...state.sessions.map(session => session.duration), 0); return `<section class="section-panel"><div class="page-heading"><span class="eyebrow">Patterns over time</span><h1>Analytics</h1><p>See the shape of your effort — weekly volume, daily consistency, subject balance, and trend.</p></div><div class="analytics-grid stagger"><article class="card wide"><div class="card-header"><div><h2>Hours studied this week</h2><p>Monday through Sunday · ${escapeHtml(fmtMinutes(weekMinutes()))} total</p></div><span class="chip active">${escapeHtml(fmtHours(weekMinutes()))}h</span></div>${renderBarChart()}</article><article class="card wide"><div class="card-header"><div><h2>Activity heatmap</h2><p>Daily intensity across the last 13 weeks</p></div><div class="heatmap-legend"><span>Less</span><i></i><i></i><i></i><i></i><i></i><span>More</span></div></div>${renderHeatmap()}</article><article class="card"><div class="card-header"><div><h2>Time by subject</h2><p>All logged sessions</p></div></div>${renderDonut()}</article><article class="card"><div class="card-header"><div><h2>Recent trend</h2><p>Eight-week rolling view</p></div></div>${renderTrend()}</article><article class="card wide"><div class="card-header"><div><h2>Signal board</h2><p>Helpful numbers, without the noise.</p></div>${icons('analytics')}</div><div class="insight-row"><div class="insight"><strong>${escapeHtml(fmtHours(total))}h</strong><span>Total time invested</span></div><div class="insight"><strong>${avg}m</strong><span>Average session</span></div><div class="insight"><strong>${best}m</strong><span>Longest single block</span></div></div></article></div></section>`;

      function renderGoals() {
        const goals = [{key:'daily',label:'Daily focus',value:todayProgress(),current:minutesOn(todayKey()),target:Number(state.goals.daily)*60,icon:'clock',tone:'var(--md-primary)'},{key:'weekly',label:'Weekly rhythm',value:weekProgress(),current:weekMinutes(),target:Number(state.goals.weekly)*60,icon:'goals',tone:'var(--md-tertiary)'},{key:'monthly',label:'Monthly momentum',value:monthProgress(),current:monthMinutes(),target:Number(state.goals.monthly)*60,icon:'trophy',tone:'var(--md-success)'}]; return `<section class="section-panel"><div class="page-heading"><span class="eyebrow">Intentions into evidence</span><h1>Goals</h1><p>Set a pace you can return to. Progress is a signal, not a judgment.</p></div><div class="toolbar"><div class="filter-chips"><span class="chip active">${escapeHtml(fmtMinutes(weekMinutes()))} this week</span><span class="chip">${currentStreak()} day streak</span></div><button class="btn btn-filled" data-action="open-modal" data-modal="goals" data-ripple>${icons('edit')}Edit targets</button></div><div class="goal-grid stagger">${goals.map(goal => `<article class="card goal-progress-card"><div class="goal-progress-top"><div><h3>${goal.label}</h3><span>${escapeHtml(goal.key === 'daily' ? 'Today' : goal.key === 'weekly' ? 'This week' : 'This month')}</span></div><div class="stat-icon" style="color:${goal.tone};background:rgba(208,188,255,.1)">${icons(goal.icon)}</div></div><div class="goal-ring-row">${ringMarkup(goal.value, 88, `${Math.round(goal.value)}%`, '', goal.tone)}<div class="goal-numbers"><strong>${escapeHtml(fmtMinutes(goal.current))}</strong><span> of ${escapeHtml(fmtMinutes(goal.target))}</span><div class="progress"><span style="width:${goal.value}%;--progress-color:${goal.tone}"></span></div></div></div><div class="row-between"><span class="body-sm muted">${goal.value >= 100 ? 'Target complete' : `${escapeHtml(fmtMinutes(Math.max(0,goal.target-goal.current)))} remaining`}</span>${goal.value >= 100 ? `<span class="positive body-sm">${icons('check')} Nice!</span>` : `<span class="body-sm muted">Keep going</span>`}</div></article>`).join('')}</div><article class="card elevated" style="margin-top:1rem"><div class="card-header"><div><h2>Make the goal easier to keep</h2><p>Attach your intention to a specific next action.</p></div>${icons('chevron')}</div><div class="session-note">Try one 25-minute focus block before checking messages. A consistent start is more valuable than a dramatic finish.</div></article></section>`;

sk-title">${escapeHtml(task.title)}</span><div class="task-meta"><span>${escapeHtml(subject.name)}</span><span class="priority ${task.priority}">${escapeHtml(task.priority)}</span><span>${task.done ? 'Completed' : `Due ${escapeHtml(fmtDate(task.due))}`}</span></div></div><div class="row-actions"><button class="icon-btn" aria-label="Edit task" data-action="edit-task" data-id="${task.id}" data-ripple>${icons('edit')}</button><button class="icon-btn" aria-label="Delete task" data-action="delete-task" data-id="${task.id}" data-ripple>${icons('delete')}</button></div></article>`; }).join('') : `<div class="empty-state">${icons('check')}Nothing in this view yet.</div>`}</div></div></section>`;

      function renderGamification() {

ked' : ''}" title="${escapeHtml(item.desc)}"><div class="achievement-icon">${icons(item.icon)}</div><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.desc)}</span></div>`).join('')}</div></article><div class="dashboard-grid" style="margin-top:1rem"><article class="card"><div class="card-header"><div><h2>How XP works</h2><p>Progress stays legible.</p></div>${icons('award')}</div><div class="stack-sm body-md"><div class="row-between"><span>Every 30 minutes studied</span><strong class="positive">+15 XP</strong></div><div class="row-between"><span>Every completed task</span><strong class="positive">+25 XP</strong></div><div class="row-between"><span>Each new level</span><strong class="positive">500 XP</strong></div></div></article><article class="card quote-card"><span class="eyebrow">Keep the streak human</span><p class="quote-text" style="font-size:1rem;line-height:1.45rem">“${escapeHtml(quote()[0])}”</p><div class="quote-author">${escapeHtml(quote()[1])}</div></article></div></section>`;

      function renderSettings() {
        const favorites = state.favoriteQuotes.map(index => quoteData[index]).filter(Boolean); const swatches = ['#d0bcff','#b9d7ff','#9edec5','#f3c66b','#f4b8ce','#a8d4d6','#d7b9f2']; return `<section class="section-panel"><div class="page-heading"><span class="eyebrow">Make it yours</span><h1>Settings & data</h1><p>Everything stays in this browser. Export a backup whenever you want to move or preserve your study history.</p></div><div class="settings-grid"><article class="card setting-section"><div class="card-header"><div><h2>Accent seed</h2><p>Choose the color that carries your focus ring and active states.</p></div>${icons('settings')}</div><div class="swatches">${swatches.map(color => `<button class="swatch ${state.accent.toLowerCase() === color.toLowerCase() ? 'selected' : ''}" style="background:${color}" aria-label="Use ${color} accent" data-action="set-accent" data-color="${color}" data-ripple></button>`).join('')}</div><div class="color-row"><input id="accentPicker" type="color" value="${escapeHtml(state.accent)}" aria-label="Choose custom accent color"><div><strong>Custom accent</strong><p class="body-sm muted" style="margin:.15rem 0 0">M3 roles are derived locally from this seed.</p></div></div></article><article class="card setting-section"><div class="card-header"><div><h2>Goal targets</h2><p>Current pacing targets for your progress cards.</p></div><button class="btn btn-text" data-action="open-modal" data-modal="goals" data-ripple>Edit</button></div><div class="stack-sm"><div class="row-between"><span>Daily focus</span><strong>${escapeHtml(state.goals.daily)}h</strong></div><div class="row-between"><span>Weekly rhythm</span><strong>${escapeHtml(state.goals.weekly)}h</strong></div><div class="row-between"><span>Monthly momentum</span><strong>${escapeHtml(state.goals.monthly)}h</strong></div></div></article><article class="card setting-section"><div class="card-header"><div><h2>Backup & restore</h2><p>Portable JSON, no account required.</p></div>${icons('database')}</div><div class="data-actions"><button class="btn btn-tonal" data-action="export-data" data-ripple>${icons('download')}Export JSON</button><button class="btn btn-outlined" data-action="import-data" data-ripple>${icons('upload')}Import JSON</button></div><div class="session-note">Your exported file includes subjects, sessions, tasks, notes, goals, timer settings, and favorite quotes.</div></article><article class="card setting-section"><div class="card-header"><div><h2>Reset sample workspace</h2><p>Clear local changes and start with the seeded study plan data.</p></div>${icons('refresh')}</div><button class="btn btn-outlined" style="color:var(--md-error);border-color:var(--md-error)" data-action="reset-data" data-ripple>${icons('delete')}Reset all local data</button></article><article class="card wide" style="grid-column:1/-1"><div class="card-header"><div><h2>Favorite quotes</h2><p>${favorites.length} saved for later</p></div><button class="btn btn-text" data-action="shuffle-quote" data-ripple>Find another ${icons('shuffle')}</button></div><div class="stack-sm">${favorites.length ? favorites.map(item => `<div class="favorite-quote"><p>“${escapeHtml(item[0])}”</p><span>${escapeHtml(item[1])}</span></div>`).join('') : '<span class="muted body-sm">Favorite a quote from the dashboard or achievements page.</span>'}</div></article></div></section>`;

      function openModal(kind, id = null, subjectOverride = null) {
        const dialog = $('#appDialog'); dialog.dataset.kind = kind; dialog.dataset.id = id || ''; const body = $('#dialogBody'); let title = 'Add'; let subtitle = '';
        if (kind === 'session') { const session = state.sessions.find(item => item.id === id) || {subjectId: subjectOverride || state.focus.subjectId || state.subjects[0]?.id, duration:25, date:todayKey(), notes:''}; title = id ? 'Edit session' : 'Log study session'; subtitle = 'Keep the ledger honest and useful.'; body.innerHTML = `<form id="modalForm"><div class="form-grid"><div><label class="field-label" for="modalSubject">Subject</label><select class="select" id="modalSubject" required>${state.subjects.map(subject => `<option value="${subject.id}" ${session.subjectId === subject.id ? 'selected' : ''}>${escapeHtml(subject.name)}</option>`).join('')}</select></div><div><label class="field-label" for="modalDuration">Duration (minutes)</label><input class="field" id="modalDuration" type="number" min="1" max="1440" value="${escapeHtml(session.duration)}" required></div><div><label class="field-label" for="modalDate">Date</label><input class="field" id="modalDate" type="date" value="${escapeHtml(session.date)}" required></div><div class="full"><label class="field-label" for="modalNotes">Notes</label><textarea class="field" id="modalNotes" placeholder="What did you work on? What failed?">${escapeHtml(session.notes)}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-outlined" data-action="close-modal" data-ripple>Cancel</button><button class="btn btn-filled" type="submit" data-ripple>${id ? 'Save changes' : 'Log session'}</button></div></form>`; }
        if (kind === 'subject') { const subject = state.subjects.find(item => item.id === id) || {name:'',icon:'code',color:'#b9d7ff',target:4}; title = id ? 'Edit subject' : 'Add subject'; subtitle = 'A clear name and a reachable weekly target.'; body.innerHTML = `<form id="modalForm"><div class="form-grid"><div class="full"><label class="field-label" for="modalSubjectName">Subject name</label><input class="field" id="modalSubjectName" maxlength="60" value="${escapeHtml(subject.name)}" placeholder="e.g. Distributed systems" required></div><div><label class="field-label" for="modalIcon">Icon</label><select class="select" id="modalIcon">${['code','brain','database','analytics','trophy','notes','timer','tasks'].map(name => `<option value="${name}" ${subject.icon === name ? 'selected' : ''}>${name[0].toUpperCase()+name.slice(1)}</option>`).join('')}</select></div><div><label class="field-label" for="modalColor">Color tag</label><input class="field" id="modalColor" type="color" value="${escapeHtml(subject.color)}" style="padding:.35rem;height:3rem"></div><div><label class="field-label" for="modalTarget">Weekly target (hours)</label><input class="field" id="modalTarget" type="number" min=".5" max="80" step=".5" value="${escapeHtml(subject.target)}" required></div></div><div class="form-actions"><button type="button" class="btn btn-outlined" data-action="close-modal" data-ripple>Cancel</button><button class="btn btn-filled" type="submit" data-ripple>${id ? 'Save subject' : 'Add subject'}</button></div></form>`; }
        if (kind === 'task') { const task = state.tasks.find(item => item.id === id) || {title:'',subjectId:state.subjects[0]?.id,priority:'medium',due:todayKey()}; title = id ? 'Edit task' : 'Add task'; subtitle = 'Make the next action specific enough to start.'; body.innerHTML = `<form id="modalForm"><div class="form-grid"><div class="full"><label class="field-label" for="modalTaskTitle">Task</label><input class="field" id="modalTaskTitle" maxlength="120" value="${escapeHtml(task.title)}" placeholder="e.g. Re-solve Course Schedule without hints" required></div><div><label class="field-label" for="modalTaskSubject">Subject</label><select class="select" id="modalTaskSubject">${state.subjects.map(subject => `<option value="${subject.id}" ${task.subjectId === subject.id ? 'selected' : ''}>${escapeHtml(subject.name)}</option>`).join('')}</select></div><div><label class="field-label" for="modalPriority">Priority</label><select class="select" id="modalPriority">${['high','medium','low'].map(priority => `<option value="${priority}" ${task.priority === priority ? 'selected' : ''}>${priority[0].toUpperCase()+priority.slice(1)}</option>`).join('')}</select></div><div><label class="field-label" for="modalDue">Due date</label><input class="field" id="modalDue" type="date" value="${escapeHtml(task.due)}" required></div></div><div class="form-actions"><button type="button" class="btn btn-outlined" data-action="close-modal" data-ripple>Cancel</button><button class="btn btn-filled" type="submit" data-ripple>${id ? 'Save task' : 'Add task'}</button></div></form>`; }
        if (kind === 'note') { const note = state.notes.find(item => item.id === id) || {title:'',subjectId:state.subjects[0]?.id,body:''}; title = id ? 'Edit note' : 'Add note'; subtitle = 'Write enough for your future self to understand.'; body.innerHTML = `<form id="modalForm"><div class="form-grid"><div class="full"><label class="field-label" for="modalNoteTitle">Title</label><input class="field" id="modalNoteTitle" maxlength="80" value="${escapeHtml(note.title)}" placeholder="e.g. Debugging checklist" required></div><div><label class="field-label" for="modalNoteSubject">Linked subject</label><select class="select" id="modalNoteSubject">${state.subjects.map(subject => `<option value="${subject.id}" ${note.subjectId === subject.id ? 'selected' : ''}>${escapeHtml(subject.name)}</option>`).join('')}</select></div><div class="full"><label class="field-label" for="modalNoteBody">Note</label><textarea class="field" id="modalNoteBody" maxlength="2000" placeholder="Capture the idea, failure mode, or next question." required>${escapeHtml(note.body)}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-outlined" data-action="close-modal" data-ripple>Cancel</button><button class="btn btn-filled" type="submit" data-ripple>${id ? 'Save note' : 'Add note'}</button></div></form>`; }
        if (kind === 'goals') { title = 'Edit goals'; subtitle = 'Pick a pace that supports your real week.'; body.innerHTML = `<form id="modalForm"><div class="form-grid"><div><label class="field-label" for="modalDaily">Daily target (hours)</label><input class="field" id="modalDaily" type="number" min=".5" max="24" step=".5" value="${escapeHtml(state.goals.daily)}" required></div><div><label class="field-label" for="modalWeekly">Weekly target (hours)</label><input class="field" id="modalWeekly" type="number" min="1" max="168" step=".5" value="${escapeHtml(state.goals.weekly)}" required></div><div><label class="field-label" for="modalMonthly">Monthly target (hours)</label><input class="field" id="modalMonthly" type="number" min="1" max="744" step="1" value="${escapeHtml(state.goals.monthly)}" required></div></div><div class="form-actions"><button type="button" class="btn btn-outlined" data-action="close-modal" data-ripple>Cancel</button><button class="btn btn-filled" type="submit" data-ripple>Save targets</button></div></form>`; }
        $('#dialogTitle').textContent = title; $('#dialogSubtitle').textContent = subtitle; if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open',''); setTimeout(() => { const first = body.querySelector('input,select,textarea'); if (first) first.focus(); }, 30);
      }
      function closeModal() { const dialog = $('#appDialog'); if (typeof dialog.close === 'function') dialog.close(); else dialog.removeAttribute('open'); }

      function submitModal(form) {
        const kind = $('#appDialog').dataset.kind; const id = $('#appDialog').dataset.id; const value = selector => $(selector, form)?.value;
        if (kind === 'session') { const session = {id:id || uid('session'), subjectId:value('#modalSubject'), duration:clamp(Number(value('#modalDuration')) || 1, 1, 1440), date:value('#modalDate') || todayKey(), notes:value('#modalNotes') || '', source:'manual'}; const existing = state.sessions.findIndex(item => item.id === id); if (existing >= 0) state.sessions[existing] = session; else state.sessions.push(session); persist(); closeModal(); render(); showSnackbar(existing >= 0 ? 'Session updated' : 'Session logged', existing < 0 ? () => deleteSession(session.id, false) : null); if (todayProgress() >= 100 || weekProgress() >= 100) celebrate(); return; }
        if (kind === 'subject') { const subject = {id:id || uid('subject'), name:value('#modalSubjectName'), icon:value('#modalIcon'), color:value('#modalColor'), target:Number(value('#modalTarget')) || 1}; const existing = state.subjects.findIndex(item => item.id === id); if (existing >= 0) state.subjects[existing] = subject; else state.subjects.push(subject); persist(); closeModal(); render(); showSnackbar(existing >= 0 ? 'Subject updated' : 'Subject added'); return; }
        if (kind === 'task') { const task = {id:id || uid('task'), title:value('#modalTaskTitle'), subjectId:value('#modalTaskSubject'), priority:value('#modalPriority'), due:value('#modalDue') || todayKey(), done:state.tasks.find(item => item.id === id)?.done || false}; const existing = state.tasks.findIndex(item => item.id === id); if (existing >= 0) state.tasks[existing] = task; else state.tasks.push(task); persist(); closeModal(); render(); showSnackbar(existing >= 0 ? 'Task updated' : 'Task added'); return; }
        if (kind === 'note') { const note = {id:id || uid('note'), title:value('#modalNoteTitle'), subjectId:value('#modalNoteSubject'), body:value('#modalNoteBody'), updated:todayKey()}; const existing = state.notes.findIndex(item => item.id === id); if (existing >= 0) state.notes[existing] = note; else state.notes.push(note); persist(); closeModal(); render(); showSnackbar(existing >= 0 ? 'Note updated' : 'Note added'); return; }
        if (kind === 'goals') { state.goals = {daily:Number(value('#modalDaily')) || 1, weekly:Number(value('#modalWeekly')) || 1, monthly:Number(value('#modalMonthly')) || 1}; persist(); closeModal(); render(); showSnackbar('Goals updated'); if (todayProgress() >= 100 || weekProgress() >= 100 || monthProgress() >= 100) celebrate(); }
      }

      function deleteSession(id, notify = true) { const index = state.sessions.findIndex(session => session.id === id); if (index < 0) return; const [removed] = state.sessions.splice(index,1); persist(); render(); if (notify) showSnackbar('Session deleted', () => { state.sessions.push(removed); persist(); render(); showSnackbar('Session restored'); }); }
      function deleteTask(id) { const index = state.tasks.findIndex(task => task.id === id); if (index < 0) return; const [removed] = state.tasks.splice(index,1); persist(); render(); showSnackbar('Task deleted', () => { state.tasks.push(removed); persist(); render(); showSnackbar('Task restored'); }); }
      function deleteNote(id) { const index = state.notes.findIndex(note => note.id === id); if (index < 0) return; const [removed] = state.notes.splice(index,1); persist(); render(); showSnackbar('Note deleted', () => { state.notes.push(removed); persist(); render(); showSnackbar('Note restored'); }); }
      function toggleTask(id) { const task = state.tasks.find(item => item.id === id); if (!task) return; task.done = !task.done; persist(); render(); showSnackbar(task.done ? 'Task complete · +25 XP' : 'Task reopened'); if (task.done && state.tasks.filter(item => item.done).length === 5) celebrate(); }
      function deleteSubject(id) { if (state.subjects.length <= 1) { showSnackbar('Keep at least one subject'); return; } const subject = getSubject(id); if (!confirm(`Delete “${subject.name}”? Existing sessions remain in your ledger as Unassigned.`)) return; state.sessions.forEach(session => { if (session.subjectId === id) session.subjectId = 'unknown'; }); state.tasks.forEach(task => { if (task.subjectId === id) task.subjectId = state.subjects.find(item => item.id !== id)?.id; }); state.notes.forEach(note => { if (note.subjectId === id) note.subjectId = state.subjects.find(item => item.id !== id)?.id; }); state.subjects = state.subjects.filter(item => item.id !== id); persist(); render(); showSnackbar('Subject deleted'); }

      function showSnackbar(message, undo) { const snack = $('#snackbar'); snack.querySelector('span').textContent = message; const undoButton = snack.querySelector('button'); undoButton.hidden = typeof undo !== 'function'; snack.dataset.undo = ''; snack._undo = undo; snack.classList.add('show'); clearTimeout(snackbarTimer); snackbarTimer = setTimeout(() => snack.classList.remove('show'), 4200); }
      function celebrate() { const celebration = $('#celebration'); const burst = $('.celebration-burst', celebration); $$('.confetti', celebration).forEach(node => node.remove()); const colors = ['#d0bcff','#f3c66b','#9edec5','#f4b8ce','#9ccaff']; for (let i=0;i<18;i++) { const piece = document.createElement('i'); piece.className = 'confetti'; piece.style.background = colors[i % colors.length]; piece.style.left = `${50 + (Math.random()*20-10)}%`; piece.style.top = `${45 + (Math.random()*10-5)}%`; piece.style.setProperty('--dx', `${Math.random()*280-140}px`); piece.style.setProperty('--dy', `${Math.random()*260-80}px`); burst.appendChild(piece); } celebration.classList.add('show'); setTimeout(() => celebration.classList.remove('show'), 1300); }
      function closeFab() { $('#fab').classList.remove('open'); }
      function toggleFab() { $('#fab').classList.toggle('open'); }

      function resetTimer(mode = 'work') { timer.mode = mode; timer.total = (mode === 'work' ? Number(state.focus.work) : Number(state.focus.break)) * 60; timer.remaining = timer.total; timer.running = false; clearInterval(timer.interval); timer.interval = null; }
      function updateTimerDom() { if (ui.view !== 'focus') return; const ring = $('.timer-ring .ring-progress'); const copy = $('.timer-ring .ring-copy strong'); const sub = $('.timer-ring .ring-copy span'); if (!ring || !copy) return; const percent = timer.total ? ((timer.total - timer.remaining) / timer.total) * 100 : 0; const radius = 150 - 12; const circumference = 2 * Math.PI * radius; ring.style.strokeDasharray = circumference; ring.style.strokeDashoffset = circumference - percent / 100 * circumference; copy.textContent = `${pad(Math.floor(timer.remaining/60))}:${pad(timer.remaining%60)}`; sub.textContent = timer.mode === 'work' ? 'focus time' : 'rest time'; }
      function timerTick() { timer.remaining -= 1; if (timer.remaining <= 0) { clearInterval(timer.interval); timer.interval = null; timer.running = false; if (timer.mode === 'work') { const logged = {id:uid('session'), subjectId:state.focus.subjectId || state.subjects[0]?.id, duration:Number(state.focus.work), date:todayKey(), notes:'Pomodoro focus session', source:'pomodoro'}; state.sessions.push(logged); persist(); showSnackbar('Focus session logged', () => deleteSession(logged.id, false)); celebrate(); resetTimer('break'); } else { showSnackbar('Break complete · ready for focus'); resetTimer('work'); } render(); return; } updateTimerDom(); }
      function toggleTimer() { if (timer.running) { timer.running = false; clearInterval(timer.interval); timer.interval = null; showSnackbar('Timer paused'); } else { timer.running = true; timer.interval = setInterval(timerTick,1000); showSnackbar(timer.mode === 'work' ? 'Focus started' : 'Break started'); } render(); }
      function setTimerMode(mode) { if (timer.running) { clearInterval(timer.interval); timer.interval = null; } resetTimer(mode); render(); }
      function skipTimer() { if (timer.running) { clearInterval(timer.interval); timer.interval = null; } resetTimer(timer.mode === 'work' ? 'break' : 'work'); render(); }

      function hexToRgb(hex) { const value = hex.replace('#',''); const full = value.length === 3 ? value.split('').map(char => char+char).join('') : value; const int = parseInt(full,16); return {r:(int>>16)&255,g:(int>>8)&255,b:int&255}; }
      function mixHex(a,b,ratio) { const x=hexToRgb(a), y=hexToRgb(b); return '#'+[x.r,x.g,x.b].map((v,i)=>Math.round(v*(1-ratio)+[y.r,y.g,y.b][i]*ratio).toString(16).padStart(2,'0')).join(''); }
      function applyAccent(hex, save = true) { if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return; state.accent = hex; const rgb = hexToRgb(hex); const luma = (0.2126*rgb.r + 0.7152*rgb.g + 0.0722*rgb.b)/255; const on = luma > .62 ? '#241b32' : '#ffffff'; const container = mixHex(hex, '#141218', .52); const onContainer = luma > .45 ? '#21152f' : '#f3eaff'; document.documentElement.style.setProperty('--md-primary',hex); document.documentElement.style.setProperty('--md-on-primary',on); document.documentElement.style.setProperty('--md-primary-container',container); document.documentElement.style.setProperty('--md-on-primary-container',onContainer); document.documentElement.style.setProperty('--md-surface-tint',hex); if (save) { persist(); render(); showSnackbar('Accent updated'); } }
      function exportData() { const blob = new Blob([JSON.stringify({...state, exportedAt:new Date().toISOString()}, null, 2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `study-tracker-${todayKey()}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); showSnackbar('Data exported'); }
      function importData(file) { const reader = new FileReader(); reader.onload = () => { try { const imported = JSON.parse(reader.result); if (!imported || !Array.isArray(imported.sessions) || !Array.isArray(imported.subjects) || !imported.subjects.length) throw new Error('Invalid backup'); const accent = typeof imported.accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(imported.accent) ? imported.accent : '#d0bcff'; state = {...createSeedState(), ...imported, accent}; persist(); applyAccent(state.accent, false); resetTimer('work'); render(); showSnackbar('Data imported'); } catch (error) { showSnackbar('That file is not a valid Study Tracker backup'); } }; reader.readAsText(file); }

      document.addEventListener('pointerdown', event => { const target = event.target.closest('[data-ripple]'); if (!target || target.disabled) return; const rect = target.getBoundingClientRect(); const ripple = document.createElement('span'); const size = Math.max(rect.width, rect.height) * 1.3; ripple.className = 'ripple'; ripple.style.width = `${size}px`; ripple.style.height = `${size}px`; ripple.style.left = `${event.clientX - rect.left - size/2}px`; ripple.style.top = `${event.clientY - rect.top - size/2}px`; target.appendChild(ripple); setTimeout(() => ripple.remove(), 550); });
      document.addEventListener('click', event => {
        const nav = event.target.closest('[data-nav]'); if (nav) { navigate(nav.dataset.nav); return; }
        const action = event.target.closest('[data-action]'); if (!action) return; const type = action.dataset.action;
        if (type === 'open-modal') { openModal(action.dataset.modal, null, action.dataset.subject || null); return; }
        if (type === 'close-modal') { closeModal(); return; }
        if (type === 'toggle-fab') { toggleFab(); return; }
        if (type === 'toggle-more') { $('#mobileMore').classList.toggle('open'); updateNav(); return; }
        if (type === 'favorite-quote') { const index = state.quoteIndex % quoteData.length; if (state.favoriteQuotes.includes(index)) state.favoriteQuotes = state.favoriteQuotes.filter(item => item !== index); else state.favoriteQuotes.push(index); persist(); render(); showSnackbar(state.favoriteQuotes.includes(index) ? 'Quote saved' : 'Quote removed'); return; }
        if (type === 'shuffle-quote') { state.quoteIndex = Math.floor(Math.random()*quoteData.length); persist(); render(); showSnackbar('New quote ready'); return; }
        if (type === 'edit-session') { openModal('session', action.dataset.id); return; }
        if (type === 'delete-session') { deleteSession(action.dataset.id); return; }
        if (type === 'edit-subject') { openModal('subject', action.dataset.id); return; }
        if (type === 'delete-subject') { deleteSubject(action.dataset.id); return; }
        if (type === 'toggle-task') { toggleTask(action.dataset.id); return; }
        if (type === 'edit-task') { openModal('task', action.dataset.id); return; }
        if (type === 'delete-task') { if (confirm('Delete this task?')) deleteTask(action.dataset.id); return; }
        if (type === 'edit-note') { openModal('note', action.dataset.id); return; }
        if (type === 'delete-note') { if (confirm('Delete this note?')) deleteNote(action.dataset.id); return; }
        if (type === 'task-filter') { ui.taskFilter = action.dataset.filter; render(); return; }
        if (type === 'timer-toggle') { toggleTimer(); return; }
        if (type === 'timer-reset') { resetTimer(timer.mode); render(); showSnackbar('Timer reset'); return; }
        if (type === 'timer-skip') { skipTimer(); return; }
        if (type === 'timer-mode') { setTimerMode(action.dataset.mode); return; }
        if (type === 'set-accent') { applyAccent(action.dataset.color); return; }
        if (type === 'export-data') { exportData(); return; }
        if (type === 'import-data') { $('#importInput').click(); return; }
        if (type === 'reset-data') { if (confirm('Reset all local study data to the sample workspace? This cannot be undone.')) { localStorage.removeItem(STORAGE_KEY); state = createSeedState(); applyAccent(state.accent, false); resetTimer('work'); render(); showSnackbar('Sample workspace restored'); } return; }
        if (type === 'snack-undo') { if (typeof $('#snackbar')._undo === 'function') $('#snackbar')._undo(); $('#snackbar').classList.remove('show'); return; }
      });
      document.addEventListener('input', event => { if (event.target.id === 'sessionSearch') { ui.sessionSearch = event.target.value; render(); const search = $('#sessionSearch'); if (search) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); } } if (event.target.id === 'accentPicker') applyAccent(event.target.value, false); });
      document.addEventListener('change', event => { if (event.target.id === 'sessionSubjectFilter') { ui.sessionSubject = event.target.value; render(); } if (event.target.id === 'sessionSort') { ui.sessionSort = event.target.value; render(); } if (event.target.id === 'noteSubjectFilter') { ui.noteSubject = event.target.value; render(); } if (event.target.id === 'accentPicker') applyAccent(event.target.value); if (event.target.id === 'focusSubject') { state.focus.subjectId = event.target.value; persist(); showSnackbar('Focus subject updated'); } if (event.target.id === 'timerWork') { state.focus.work = clamp(Number(event.target.value) || 25,1,120); persist(); if (!timer.running && timer.mode === 'work') resetTimer('work'); } if (event.target.id === 'timerBreak') { state.focus.break = clamp(Number(event.target.value) || 5,1,60); persist(); if (!timer.running && timer.mode === 'break') resetTimer('break'); } });
      $('#appDialog').addEventListener('submit', event => { event.preventDefault(); submitModal(event.target); });
      $('#importInput').addEventListener('change', event => { if (event.target.files?.[0]) importData(event.target.files[0]); event.target.value = ''; });
      $('#appDialog').addEventListener('click', event => { if (event.target === $('#appDialog')) closeModal(); });

      state = loadState();
      applyAccent(state.accent, false);
      resetTimer('work');
      render();
    })();
  </script>
