<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110e17">
  <title>Pathway 437h · SDE 2028 Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       PATHWAY 437H — ANDROID MATERIAL YOU EXPRESSIVE POP THEME
       Obsidian Canvas · Electric Amethyst · Cyber Jade · JetBrains Data
       ========================================================= */
    :root {
      --md-primary: #c084fc;
      --md-on-primary: #3b0764;
      --md-primary-container: #581c87;
      --md-on-primary-container: #f3e8ff;
      --md-secondary: #cbd5e1;
      --md-on-secondary: #1e293b;
      --md-secondary-container: #334155;
      --md-on-secondary-container: #f1f5f9;
      --md-tertiary: #f472b6;
      --md-on-tertiary: #500724;
      --md-tertiary-container: #831843;
      --md-on-tertiary-container: #fce7f3;
      --md-error: #f87171;
      --md-on-error: #450a0a;
      --md-error-container: #7f1d1d;
      --md-on-error-container: #fef2f2;
      --md-background: #0f0c15;
      --md-on-background: #f1f0f5;
      --md-surface: #13101b;
      --md-on-surface: #f1f0f5;
      --md-surface-variant: #383344;
      --md-on-surface-variant: #c4bfd0;
      --md-surface-container-lowest: #09070d;
      --md-surface-container-low: #171320;
      --md-surface-container: #1c1827;
      --md-surface-container-high: #252033;
      --md-surface-container-highest: #312b42;
      --md-outline: #79718b;
      --md-outline-variant: #453e54;
      --md-inverse-surface: #f1f0f5;
      --md-inverse-on-surface: #201d28;
      --md-inverse-primary: #9333ea;
      --md-surface-tint: #c084fc;
      --md-success: #34d399;
      --md-on-success: #022c22;
      --md-warning: #fbbf24;
      --md-on-warning: #451a03;
      --md-info: #38bdf8;
      --md-on-info: #082f49;

      --md-font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --md-font-mono: "JetBrains Mono", monospace;
      
      --md-radius-xs: .375rem;
      --md-radius-sm: .65rem;
      --md-radius-md: 1rem;
      --md-radius-lg: 1.35rem;
      --md-radius-xl: 1.85rem;
      --md-radius-full: 9999px;

      --md-elevation-1: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.24);
      --md-elevation-2: 0 4px 14px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.28);
      --md-elevation-3: 0 10px 30px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.35);
      --md-elevation-glow: 0 0 28px rgba(192,132,252,.2);

      --md-ease-standard: cubic-bezier(.2, 0, 0, 1);
      --md-ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
      --md-trans-fast: 160ms var(--md-ease-standard);
      --md-trans-medium: 280ms var(--md-ease-standard);
      --md-trans-bounce: 350ms var(--md-ease-bounce);
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--md-background);
      color: var(--md-on-background);
      font-family: var(--md-font-sans);
      font-size: .9375rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    svg { display: block; }
    a { color: var(--md-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--md-primary); outline-offset: 3px; }
    ::selection { background: var(--md-primary-container); color: var(--md-on-primary-container); }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--md-surface-container-lowest); }
    ::-webkit-scrollbar-thumb { background: var(--md-surface-container-highest); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }

    /* Material Icons Helper */
    .icon { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; fill: currentColor; }
    .icon-sm { width: 1rem; height: 1rem; }
    .icon-lg { width: 1.5rem; height: 1.5rem; }
    .icon-xl { width: 2.25rem; height: 2.25rem; }

    /* Shell Architecture */
    .app-shell { min-height: 100vh; display: flex; }
    .nav-rail {
      position: fixed; inset: 0 auto 0 0; z-index: 30;
      width: 272px; padding: 1.25rem .875rem;
      display: flex; flex-direction: column; gap: .75rem;
      background: var(--md-surface-container-low);
      border-right: 1px solid rgba(255,255,255,.06);
      overflow-y: auto;
    }
    .brand {
      display: flex; align-items: center; gap: .85rem; padding: .65rem .85rem; min-height: 3.5rem;
      border-radius: var(--md-radius-lg); background: rgba(192,132,252,.06); border: 1px solid rgba(192,132,252,.15);
    }
    .brand-mark {
      width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: var(--md-radius-md);
      background: linear-gradient(135deg, var(--md-primary), var(--md-primary-container));
      color: var(--md-on-primary); box-shadow: var(--md-elevation-glow);
    }
    .brand-copy strong { display: block; font-size: .95rem; font-weight: 800; letter-spacing: -.02em; }
    .brand-copy span { display: block; color: var(--md-primary); font-size: .6875rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-family: var(--md-font-mono); }

    .nav-label {
      padding: .25rem .75rem; color: var(--md-on-surface-variant); font-size: .6875rem;
      font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-top: .35rem;
    }
    .nav-list { display: grid; gap: .3rem; }
    .nav-item {
      position: relative; overflow: hidden; min-height: 3.1rem; width: 100%; padding: .5rem .85rem;
      border: 0; border-radius: var(--md-radius-full); background: transparent; color: var(--md-on-surface-variant);
      display: flex; align-items: center; gap: .85rem; text-align: left; font-size: .875rem; font-weight: 600;
      transition: background var(--md-trans-fast), color var(--md-trans-fast), transform var(--md-trans-fast);
    }
    .nav-item:hover { background: rgba(192,132,252,.08); color: var(--md-on-surface); }
    .nav-item.active {
      background: var(--md-secondary-container); color: var(--md-on-secondary-container);
      font-weight: 700; box-shadow: inset 0 0 0 1px rgba(192,132,252,.25);
    }
    .nav-item.active .icon { color: var(--md-primary); transform: scale(1.1); transition: transform var(--md-trans-bounce); }
    .nav-item:active { transform: scale(.97); }
    .nav-item .nav-badge {
      margin-left: auto; min-width: 1.35rem; padding: .15rem .45rem; border-radius: var(--md-radius-full);
      background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); font-size: .6875rem;
      text-align: center; font-weight: 800; font-family: var(--md-font-mono);
    }
    .nav-item .counter-pill {
      margin-left: auto; font-size: .6875rem; font-weight: 700; padding: .15rem .45rem;
      border-radius: var(--md-radius-full); background: rgba(255,255,255,.08); color: var(--md-primary); font-family: var(--md-font-mono);
    }

    .rail-spacer { flex: 1; min-height: 1rem; }
    .rail-quote {
      padding: .85rem; border-radius: var(--md-radius-md); background: var(--md-surface-container);
      color: var(--md-on-surface-variant); font-size: .75rem; line-height: 1.4; border: 1px solid rgba(255,255,255,.06);
    }
    .rail-quote strong { display: block; color: var(--md-primary); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .3rem; font-weight: 800; }

    .profile-chip {
      display: flex; align-items: center; gap: .75rem; padding: .65rem .85rem; border-radius: var(--md-radius-md);
      background: var(--md-surface-container); border: 1px solid rgba(255,255,255,.06);
    }
    .avatar {
      width: 2.35rem; height: 2.35rem; border-radius: 50%; display: grid; place-items: center;
      background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); font-weight: 800; font-size: .8125rem; font-family: var(--md-font-mono);
    }
    .profile-chip small { display: block; color: var(--md-on-surface-variant); font-size: .6875rem; }
    .profile-chip strong { display: block; font-size: .8125rem; font-weight: 700; }

    /* Main Content Area */
    .app-main { min-width: 0; width: 100%; margin-left: 272px; }
    .topbar {
      height: 4.5rem; padding: 0 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(15,12,21,.85); backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 20;
    }
    .topbar-title { display: flex; align-items: center; gap: .85rem; }
    .topbar-title h2 { margin: 0; font-size: 1.35rem; line-height: 1.3; font-weight: 800; letter-spacing: -.02em; }
    .topbar-title p { margin: 0; color: var(--md-on-surface-variant); font-size: .75rem; }
    .topbar-actions { display: flex; align-items: center; gap: .5rem; }
    .topbar .mobile-brand { display: none; }
    .content { width: min(1420px, 100%); margin: 0 auto; padding: 2rem 2.5rem 6rem; }

    .section-panel { animation: section-in var(--md-trans-medium) both; }
    @keyframes section-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .stagger > * { animation: card-in var(--md-trans-medium) both; }
    .stagger > *:nth-child(2) { animation-delay: 35ms; }
    .stagger > *:nth-child(3) { animation-delay: 70ms; }
    .stagger > *:nth-child(4) { animation-delay: 105ms; }
    .stagger > *:nth-child(5) { animation-delay: 140ms; }

    .eyebrow { color: var(--md-primary); font-size: .6875rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-family: var(--md-font-mono); }
    .page-heading { margin-bottom: 1.75rem; }
    .page-heading h1 { margin: .25rem 0 .4rem; font-size: clamp(1.85rem, 3.5vw, 2.75rem); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; }
    .page-heading p { margin: 0; color: var(--md-on-surface-variant); max-width: 74ch; font-size: .9375rem; }

    .card, .surface-card {
      position: relative; overflow: hidden; background: var(--md-surface-container-low);
      border: 1px solid rgba(255,255,255,.07); border-radius: var(--md-radius-lg); color: var(--md-on-surface);
      box-shadow: var(--md-elevation-1);
    }
    .card { padding: 1.35rem; }
    .surface-card { padding: 1.15rem; background: var(--md-surface-container); }
    .card.elevated {
      background: linear-gradient(145deg, rgba(192,132,252,.06), rgba(192,132,252,.02)), var(--md-surface-container);
      box-shadow: var(--md-elevation-2); border-color: rgba(192,132,252,.16);
    }
    .card.high { background: var(--md-surface-container-high); box-shadow: var(--md-elevation-2); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
    .card-header h2, .card-header h3 { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
    .card-header p { margin: .2rem 0 0; color: var(--md-on-surface-variant); font-size: .75rem; }
    .divider { height: 1px; background: rgba(255,255,255,.08); }
    .stack { display: grid; gap: 1rem; }
    .stack-sm { display: grid; gap: .5rem; }
    .row { display: flex; align-items: center; gap: .75rem; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .wrap { flex-wrap: wrap; }

    /* Pop Android Material 3 Buttons */
    .btn {
      min-height: 2.65rem; padding: 0 1.25rem; border: 0; border-radius: var(--md-radius-full);
      display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
      font-size: .875rem; font-weight: 700; letter-spacing: .01em;
      transition: transform var(--md-trans-fast), background var(--md-trans-fast), box-shadow var(--md-trans-fast), filter var(--md-trans-fast);
    }
    .btn:active { transform: scale(.96); }
    .btn-sm { min-height: 2rem; padding: 0 .85rem; font-size: .75rem; }
    .btn-filled {
      background: var(--md-primary); color: var(--md-on-primary);
      box-shadow: 0 2px 8px rgba(192,132,252,.35);
    }
    .btn-filled:hover { filter: brightness(1.08); box-shadow: 0 4px 16px rgba(192,132,252,.5); }
    .btn-tonal { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .btn-tonal:hover { filter: brightness(1.15); }
    .btn-outlined { background: transparent; color: var(--md-primary); border: 1px solid rgba(192,132,252,.35); }
    .btn-outlined:hover { background: rgba(192,132,252,.08); border-color: var(--md-primary); }
    .btn-text { min-height: 2.25rem; padding: 0 .75rem; background: transparent; color: var(--md-primary); }
    .btn-text:hover { background: rgba(192,132,252,.08); }

    .icon-btn {
      position: relative; overflow: hidden; width: 2.5rem; height: 2.5rem; padding: 0;
      display: inline-grid; place-items: center; border: 0; border-radius: 50%;
      background: transparent; color: var(--md-on-surface-variant);
      transition: background var(--md-trans-fast), color var(--md-trans-fast), transform var(--md-trans-fast);
    }
    .icon-btn:hover { background: rgba(192,132,252,.1); color: var(--md-on-surface); }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn.selected { color: var(--md-primary); background: rgba(192,132,252,.16); }
    .ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .16; pointer-events: none; animation: ripple 450ms var(--md-ease-standard); }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    /* Dashboard Layout */
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, .85fr); gap: 1rem; margin-bottom: 1.25rem; }
    .welcome-card {
      min-height: 240px; padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between;
      background: radial-gradient(circle at 88% 12%, rgba(192,132,252,.32), transparent 45%), linear-gradient(135deg, rgba(88,28,135,.95), rgba(23,19,32,.98) 75%);
      border: 1px solid rgba(192,132,252,.28); box-shadow: var(--md-elevation-glow);
    }
    .welcome-card h1 { max-width: 18ch; margin: .4rem 0 .75rem; font-size: clamp(1.85rem, 3.5vw, 2.85rem); line-height: 1.08; font-weight: 800; letter-spacing: -.04em; }
    .welcome-card p { max-width: 52ch; margin: 0; color: #ede7f6; font-size: .9375rem; }
    .welcome-date { color: var(--md-primary); font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-family: var(--md-font-mono); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.35rem; }

    .goal-card { min-height: 240px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1.25rem; }
    .goal-card .goal-copy h2 { margin: .25rem 0 .35rem; font-size: 1.4rem; font-weight: 800; font-family: var(--md-font-mono); }
    .goal-card .goal-copy p { margin: 0; color: var(--md-on-surface-variant); font-size: .8125rem; }

    .ring-wrap { position: relative; display: grid; place-items: center; flex: 0 0 auto; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--md-surface-container-highest); }
    .ring-progress { fill: none; stroke: var(--md-primary); stroke-linecap: round; transition: stroke-dashoffset var(--md-trans-medium); }
    .ring-copy { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-copy strong { font-size: 1.5rem; line-height: 1.2; font-weight: 800; font-family: var(--md-font-mono); }
    .ring-copy span { color: var(--md-on-surface-variant); font-size: .6875rem; text-transform: uppercase; font-weight: 700; letter-spacing: .05em; font-family: var(--md-font-mono); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
    .stat-card {
      min-height: 130px; display: flex; flex-direction: column; justify-content: space-between;
      border-radius: var(--md-radius-lg); background: var(--md-surface-container-low);
    }
    .stat-card .stat-icon {
      width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border-radius: var(--md-radius-md);
      background: var(--md-secondary-container); color: var(--md-primary);
    }
    .stat-card strong { display: block; margin-top: .5rem; font-size: 1.65rem; font-weight: 800; font-family: var(--md-font-mono); letter-spacing: -.02em; }
    .stat-card span { color: var(--md-on-surface-variant); font-size: .75rem; font-weight: 600; }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(280px, .82fr); gap: 1rem; }
    .quote-card {
      background: linear-gradient(135deg, rgba(131,24,67,.55), rgba(28,24,39,.98));
      border-color: rgba(244,114,182,.2);
    }
    .quote-mark { color: var(--md-tertiary); font-size: 3.25rem; line-height: 2rem; font-family: Georgia, serif; }
    .quote-text { margin: .25rem 0 1rem; font-size: 1.25rem; line-height: 1.5; font-weight: 700; letter-spacing: -.01em; }
    .quote-author { color: var(--md-on-surface-variant); font-size: .8125rem; font-weight: 600; }
    .quote-author::before { content: "— "; color: var(--md-tertiary); }

    .subject-list { display: grid; gap: .85rem; }
    .subject-row { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: .85rem; align-items: center; }
    .subject-icon { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border-radius: var(--md-radius-md); color: #0f0c15; }
    .subject-meta strong { display: block; font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subject-meta span { display: block; margin-top: .15rem; color: var(--md-on-surface-variant); font-size: .6875rem; font-family: var(--md-font-mono); }
    .subject-percent { font-size: .75rem; font-family: var(--md-font-mono); font-weight: 800; }
    .progress { height: .55rem; margin-top: .45rem; overflow: hidden; border-radius: var(--md-radius-full); background: var(--md-surface-container-highest); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--progress-color, var(--md-primary)); transition: width var(--md-trans-medium); }

    .task-preview { display: grid; gap: .6rem; }
    .task-line { display: flex; align-items: center; gap: .75rem; min-width: 0; padding: .65rem .85rem; border-radius: var(--md-radius-md); background: rgba(49,43,66,.5); border: 1px solid rgba(255,255,255,.05); }
    .task-line.done { opacity: .55; }
    .task-line.done .task-title { text-decoration: line-through; }
    .task-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8125rem; font-weight: 600; }
    .task-due { color: var(--md-on-surface-variant); font-size: .6875rem; white-space: nowrap; font-family: var(--md-font-mono); }

    /* Interactive Checkbox Button */
    .check-btn {
      width: 1.65rem; height: 1.65rem; padding: 0; border-radius: var(--md-radius-sm); border: 2px solid var(--md-outline);
      background: transparent; color: transparent; display: grid; place-items: center; flex: 0 0 auto;
      transition: background var(--md-trans-fast), border-color var(--md-trans-fast), color var(--md-trans-fast), transform var(--md-trans-bounce);
    }
    .check-btn:hover { border-color: var(--md-primary); transform: scale(1.1); }
    .check-btn.checked {
      border-color: var(--md-success); background: var(--md-success); color: var(--md-on-success);
      transform: scale(1.04);
    }
    .check-btn .icon { width: 1rem; height: 1rem; }

    /* Dynamic Checklist Item Component */
    .dynamic-checklist { display: grid; gap: .5rem; margin: .75rem 0; }
    .checklist-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .75rem; align-items: center;
      padding: .65rem .85rem; border-radius: var(--md-radius-md); background: var(--md-surface-container);
      border: 1px solid rgba(255,255,255,.05); transition: background var(--md-trans-fast), border-color var(--md-trans-fast);
    }
    .checklist-row:hover { background: var(--md-surface-container-high); border-color: rgba(192,132,252,.25); }
    .checklist-row.checked { background: rgba(52,211,153,.07); border-color: rgba(52,211,153,.25); }
    .checklist-row.checked .item-text { color: var(--md-on-surface-variant); text-decoration: line-through; }
    .item-text { font-size: .8125rem; font-weight: 600; color: var(--md-on-surface); }
    .item-tag { font-size: .6875rem; padding: .15rem .45rem; border-radius: var(--md-radius-full); background: rgba(255,255,255,.08); color: var(--md-on-surface-variant); font-weight: 700; font-family: var(--md-font-mono); }

    /* Pop Filters and Toolbars */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
    .search-wrap { position: relative; flex: 1 1 260px; }
    .search-wrap .icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--md-on-surface-variant); }
    .field, .select {
      width: 100%; min-height: 3rem; padding: .75rem 1rem; border: 1px solid var(--md-outline);
      border-radius: var(--md-radius-md); background: var(--md-surface-container-highest);
      color: var(--md-on-surface); outline: 0; font-weight: 600;
      transition: border-color var(--md-trans-fast), box-shadow var(--md-trans-fast), background var(--md-trans-fast);
    }
    .search-wrap .field { padding-left: 2.85rem; }
    .field::placeholder { color: var(--md-on-surface-variant); }
    .field:focus, .select:focus { border-color: var(--md-primary); box-shadow: 0 0 0 2px rgba(192,132,252,.3); background: var(--md-surface-container-high); }
    textarea.field { min-height: 7.5rem; resize: vertical; }
    .field-label { display: block; margin-bottom: .4rem; color: var(--md-on-surface-variant); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-family: var(--md-font-mono); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: .65rem; margin-top: 1.5rem; }
    
    .filter-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip {
      min-height: 2.15rem; padding: 0 .95rem; border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--md-radius-full); background: var(--md-surface-container);
      color: var(--md-on-surface-variant); display: inline-flex; align-items: center; gap: .4rem;
      font-size: .75rem; font-weight: 700; transition: all var(--md-trans-fast);
    }
    .chip:hover { border-color: var(--md-primary); color: var(--md-on-surface); transform: translateY(-1px); }
    .chip.active {
      border-color: var(--md-primary); background: var(--md-primary-container); color: var(--md-on-primary-container);
      box-shadow: 0 2px 10px rgba(88,28,135,.4);
    }

    /* Badges & Tags */
    .badge-tag {
      display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border-radius: var(--md-radius-full);
      font-size: .6875rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-family: var(--md-font-mono);
      background: var(--md-surface-container-highest); color: var(--md-on-surface-variant);
    }
    .badge-tag.primary { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .badge-tag.warning { background: rgba(251,191,36,.2); color: var(--md-warning); }
    .badge-tag.success { background: rgba(52,211,153,.2); color: var(--md-success); }
    .badge-tag.error { background: rgba(248,113,113,.2); color: var(--md-error); }

    /* Plan & Week Card */
    .plan-week-card {
      border-left: 5px solid var(--md-primary); border-radius: var(--md-radius-lg); margin-bottom: 1.25rem;
      transition: transform var(--md-trans-fast), box-shadow var(--md-trans-fast);
    }
    .plan-week-card:hover { box-shadow: var(--md-elevation-2); }
    .plan-week-card.current {
      border-left-color: var(--md-warning);
      background: linear-gradient(135deg, rgba(251,191,36,.06), rgba(28,24,39,.98));
      border-color: rgba(251,191,36,.3);
    }
    .plan-week-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .plan-table { width: 100%; border-collapse: collapse; margin: .85rem 0; font-size: .8125rem; }
    .plan-table th, .plan-table td { padding: .55rem .75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); }
    .plan-table th { color: var(--md-on-surface-variant); font-size: .6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-family: var(--md-font-mono); }
    .plan-table td:last-child, .plan-table th:last-child { text-align: right; font-family: var(--md-font-mono); }
    
    .gate-box {
      padding: 1rem; border-radius: var(--md-radius-md); background: rgba(88,28,135,.22);
      border: 1px solid rgba(192,132,252,.28); margin-top: .85rem; font-size: .8125rem;
    }
    .gate-box strong { color: var(--md-primary); display: block; margin-bottom: .4rem; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-family: var(--md-font-mono); font-weight: 800; }

    /* DSA Grid & Cards */
    .dsa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: .85rem; }
    .dsa-item-card {
      padding: 1rem; border-radius: var(--md-radius-md); background: var(--md-surface-container);
      display: grid; gap: .55rem; border: 1px solid rgba(255,255,255,.06);
      transition: transform var(--md-trans-fast), border-color var(--md-trans-fast), background var(--md-trans-fast);
    }
    .dsa-item-card:hover { transform: translateY(-2px); border-color: rgba(192,132,252,.3); background: var(--md-surface-container-high); }
    .dsa-item-card.solved {
      border-color: rgba(52,211,153,.35); background: linear-gradient(135deg, rgba(52,211,153,.08), var(--md-surface-container));
    }
    .dsa-chip-list { display: flex; flex-wrap: wrap; gap: .45rem; margin: .6rem 0; }
    .dsa-chip {
      padding: .3rem .7rem; border-radius: var(--md-radius-sm); background: var(--md-surface-container-highest);
      font-size: .75rem; font-weight: 600; display: inline-flex; align-items: center; gap: .45rem;
      border: 1px solid rgba(255,255,255,.07); cursor: pointer; transition: all var(--md-trans-fast);
    }
    .dsa-chip:hover { border-color: var(--md-primary); transform: scale(1.02); }
    .dsa-chip.solved { background: rgba(52,211,153,.2); color: var(--md-success); border-color: rgba(52,211,153,.45); }

    /* Applications Table */
    .app-table-wrap { overflow-x: auto; margin-top: 1rem; border-radius: var(--md-radius-md); border: 1px solid rgba(255,255,255,.07); }
    .app-table { width: 100%; border-collapse: collapse; font-size: .8125rem; white-space: nowrap; }
    .app-table th, .app-table td { padding: .75rem .95rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); }
    .app-table th { color: var(--md-on-surface-variant); font-size: .6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; background: var(--md-surface-container); font-family: var(--md-font-mono); }
    .app-table tr:hover td { background: var(--md-surface-container-high); }
    .status-pill {
      display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .65rem; border-radius: var(--md-radius-full);
      font-size: .6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-family: var(--md-font-mono);
    }
    .status-saved { background: var(--md-surface-container-highest); color: var(--md-on-surface-variant); }
    .status-applied { background: rgba(56,189,248,.2); color: var(--md-info); }
    .status-oareceived { background: rgba(251,191,36,.2); color: var(--md-warning); }
    .status-technicalround { background: rgba(192,132,252,.25); color: var(--md-primary); }
    .status-offered { background: rgba(52,211,153,.25); color: var(--md-success); font-weight: 900; }
    .status-rejected { background: rgba(248,113,113,.2); color: var(--md-error); }
    .status-ghosted { background: rgba(121,113,139,.18); color: var(--md-outline); }

    /* Focus Timer Layout */
    .focus-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: 1rem; }
    .timer-card {
      min-height: 520px; display: grid; place-items: center; text-align: center;
      background: radial-gradient(circle at 50% 38%, rgba(192,132,252,.16), transparent 40%), var(--md-surface-container-low);
    }
    .timer-ring { margin: 1.25rem 0; }
    .timer-actions { display: flex; align-items: center; justify-content: center; gap: .75rem; }
    .timer-primary { min-width: 9.5rem; }
    .mode-tabs { display: flex; padding: .3rem; border-radius: var(--md-radius-full); background: var(--md-surface-container); border: 1px solid rgba(255,255,255,.06); }
    .mode-tab { min-height: 2.25rem; padding: 0 1.1rem; border: 0; border-radius: var(--md-radius-full); background: transparent; color: var(--md-on-surface-variant); font-size: .75rem; font-weight: 800; font-family: var(--md-font-mono); }
    .mode-tab.active { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
    .timer-meta { width: min(360px, 100%); margin-top: 1.25rem; text-align: left; }
    .focus-side { display: grid; align-content: start; gap: 1rem; }
    .session-note { padding: .95rem; border-left: 4px solid var(--md-primary); border-radius: .2rem var(--md-radius-md) var(--md-radius-md) .2rem; background: var(--md-surface-container); color: var(--md-on-surface-variant); font-size: .8125rem; line-height: 1.45; }

    /* Sessions Ledger List */
    .session-list { display: grid; gap: .65rem; }
    .session-row {
      display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto auto; align-items: center; gap: .95rem;
      padding: .85rem 1rem; border-radius: var(--md-radius-md); background: var(--md-surface-container);
      border: 1px solid transparent; transition: background var(--md-trans-fast), transform var(--md-trans-fast);
    }
    .session-row:hover { background: var(--md-surface-container-high); border-color: rgba(192,132,252,.25); transform: translateY(-1px); }
    .session-icon { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border-radius: var(--md-radius-sm); color: #0f0c15; }
    .session-main strong { display: block; font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-main span { display: block; color: var(--md-on-surface-variant); font-size: .6875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--md-font-mono); }
    .session-duration strong { display: block; font-size: .95rem; font-weight: 800; font-family: var(--md-font-mono); }

    /* Grids & Cards */
    .subject-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .subject-card { display: grid; gap: .85rem; }
    .subject-card-head { display: flex; align-items: flex-start; gap: .85rem; }
    .subject-card-head .subject-icon { width: 2.75rem; height: 2.75rem; border-radius: var(--md-radius-md); }
    .target-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .target-row strong { font-size: 1.35rem; font-weight: 800; font-family: var(--md-font-mono); }

    .analytics-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .analytics-grid .wide { grid-column: 1 / -1; }
    .insight-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .85rem; }
    .insight { padding: .95rem; border-radius: var(--md-radius-md); background: var(--md-surface-container); }
    .insight strong { display: block; font-size: 1.35rem; font-weight: 800; font-family: var(--md-font-mono); }
    .insight span { color: var(--md-on-surface-variant); font-size: .6875rem; font-weight: 700; font-family: var(--md-font-mono); }

    .goal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .goal-progress-card { display: grid; gap: 1rem; }
    .goal-progress-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .goal-progress-top h3 { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .goal-numbers strong { font-size: 1.6rem; font-weight: 800; font-family: var(--md-font-mono); }
    .goal-ring-row { display: flex; align-items: center; gap: 1.15rem; }

    .task-layout { display: grid; grid-template-columns: minmax(280px, .7fr) minmax(0, 1.3fr); gap: 1rem; align-items: start; }
    .task-list { display: grid; gap: .65rem; }
    .task-card {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .85rem; align-items: center;
      padding: .85rem 1rem; border-radius: var(--md-radius-md); background: var(--md-surface-container);
      border: 1px solid rgba(255,255,255,.05); transition: transform var(--md-trans-fast), background var(--md-trans-fast);
    }
    .task-card:hover { background: var(--md-surface-container-high); transform: translateX(2px); }
    .task-card.done { opacity: .55; }
    .task-card.done .task-title { text-decoration: line-through; }
    .task-detail .task-title { display: block; font-size: .875rem; font-weight: 700; }
    .task-detail .task-meta { display: flex; flex-wrap: wrap; gap: .4rem .75rem; margin-top: .25rem; color: var(--md-on-surface-variant); font-size: .6875rem; font-family: var(--md-font-mono); }
    .priority { padding: .18rem .45rem; border-radius: var(--md-radius-full); font-size: .625rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-family: var(--md-font-mono); }
    .priority.high { background: rgba(248,113,113,.2); color: var(--md-error); }
    .priority.medium { background: rgba(251,191,36,.2); color: var(--md-warning); }
    .priority.low { background: rgba(52,211,153,.2); color: var(--md-success); }

    .notes-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .note-card { min-height: 170px; display: flex; flex-direction: column; gap: .75rem; }
    .note-card h3 { margin: 0; font-size: 1rem; font-weight: 800; }
    .note-card p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin: 0; color: var(--md-on-surface-variant); font-size: .8125rem; line-height: 1.4; white-space: pre-wrap; }
    .note-footer { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: auto; color: var(--md-on-surface-variant); font-size: .6875rem; font-family: var(--md-font-mono); }

    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
    .swatches { display: flex; flex-wrap: wrap; gap: .65rem; }
    .swatch { width: 2.35rem; height: 2.35rem; border: 2px solid transparent; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); cursor: pointer; transition: transform var(--md-trans-fast); }
    .swatch:hover { transform: scale(1.1); }
    .swatch.selected { border-color: var(--md-on-surface); box-shadow: 0 0 0 2px var(--md-primary); }
    .color-row { display: flex; align-items: center; gap: .85rem; }
    input[type="color"] { width: 3.5rem; height: 3rem; padding: .25rem; border: 1px solid var(--md-outline); border-radius: var(--md-radius-md); background: var(--md-surface-container-highest); }
    .data-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }

    /* Modals & Dialogs */
    dialog {
      width: min(640px, calc(100% - 2rem)); max-height: calc(100vh - 2rem); padding: 0; border: 0;
      border-radius: var(--md-radius-xl); background: var(--md-surface-container-high); color: var(--md-on-surface);
      box-shadow: var(--md-elevation-3); border: 1px solid rgba(255,255,255,.1);
    }
    dialog::backdrop { background: rgba(0,0,0,.68); backdrop-filter: blur(6px); }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.35rem 1.35rem .75rem; }
    .dialog-head h2 { margin: 0; font-size: 1.35rem; font-weight: 800; }
    .dialog-head p { margin: .2rem 0 0; color: var(--md-on-surface-variant); font-size: .75rem; }
    .dialog-body { padding: .5rem 1.35rem 1.35rem; overflow-y: auto; max-height: calc(85vh - 6rem); }

    .snackbar {
      position: fixed; left: 50%; bottom: 1.35rem; z-index: 80; min-width: min(360px, calc(100vw - 2rem));
      max-width: calc(100vw - 2rem); padding: .75rem 1rem; display: flex; align-items: center; gap: .85rem;
      transform: translate(-50%, 160%); border-radius: var(--md-radius-md); background: var(--md-inverse-surface);
      color: var(--md-inverse-on-surface); box-shadow: var(--md-elevation-3); font-weight: 700;
      transition: transform var(--md-trans-bounce);
    }
    .snackbar.show { transform: translate(-50%, 0); }
    .snackbar span { flex: 1; font-size: .8125rem; }
    .snackbar button { min-height: 2rem; padding: 0 .65rem; border: 0; border-radius: var(--md-radius-full); background: transparent; color: var(--md-inverse-primary); font-size: .75rem; font-weight: 800; }

    .fab { position: fixed; right: 1.35rem; bottom: 1.35rem; z-index: 25; display: none; flex-direction: column; align-items: flex-end; gap: .75rem; }
    .fab-main {
      width: 3.5rem; height: 3.5rem; padding: 0; border: 0; border-radius: var(--md-radius-lg);
      display: grid; place-items: center; background: var(--md-primary); color: var(--md-on-primary);
      box-shadow: 0 4px 18px rgba(192,132,252,.45); transition: transform var(--md-trans-bounce);
    }
    .fab.open .fab-main { transform: rotate(45deg); }
    .fab-menu { display: none; flex-direction: column; align-items: flex-end; gap: .6rem; }
    .fab.open .fab-menu { display: flex; animation: section-in var(--md-trans-fast) both; }
    .fab-action {
      min-height: 2.6rem; padding: 0 .85rem 0 1.1rem; display: inline-flex; align-items: center; gap: .55rem;

      color: var(--md-on-surface); box-shadow: var(--md-elevation-2); font-size: .8125rem; font-weight: 700;
    }
    .bottom-nav { display: none; }
    .mobile-more { display: none; }
    .mobile-more.open {
      display: grid; position: fixed; inset: auto .75rem 5.65rem; z-index: 24;
      grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; padding: .75rem;
      border: 1px solid rgba(255,255,255,.1); border-radius: var(--md-radius-lg);
      background: var(--md-surface-container-high); box-shadow: var(--md-elevation-3);
      animation: section-in var(--md-trans-fast) both;
    }
    .mobile-more .nav-item { min-height: 2.9rem; padding: .5rem .75rem; border-radius: var(--md-radius-md); }

    .celebration { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; pointer-events: none; opacity: 0; visibility: hidden; }
    .celebration.show { opacity: 1; visibility: visible; }
    .celebration-burst {
      position: relative; padding: 1.35rem 1.75rem; border-radius: var(--md-radius-xl);
      background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--md-elevation-3);
      font-weight: 800; font-size: 1.1rem; transform: scale(.75);
    }
    .celebration.show .celebration-burst { animation: celebrate-pop 1.2s var(--md-ease-bounce) both; }
    .confetti { position: absolute; width: 8px; height: 14px; border-radius: 2px; animation: confetti-fall 1.2s ease-out both; }
    @keyframes celebrate-pop { 0% { transform: scale(.75); opacity: 0; } 25% { transform: scale(1.08); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes confetti-fall { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
    .empty-state { padding: 2.25rem 1rem; text-align: center; color: var(--md-on-surface-variant); border: 1px dashed rgba(255,255,255,.15); border-radius: var(--md-radius-lg); }
    .empty-state .icon { width: 2.25rem; height: 2.25rem; margin: 0 auto .75rem; color: var(--md-primary); }

    /* Responsive Mobile Breakpoints */
    @media (max-width: 1199px) {
      .nav-rail { width: 84px; padding-inline: .65rem; }
      .app-main { margin-left: 84px; }
      .brand { justify-content: center; padding-inline: 0; }
      .brand-copy, .nav-label, .nav-item span, .rail-quote, .profile-chip > div, .nav-item .counter-pill { display: none; }
      .nav-item { justify-content: center; padding-inline: 0; }
      .nav-item .nav-badge { position: absolute; top: .3rem; right: .3rem; margin: 0; min-width: 1.1rem; font-size: .6rem; }
      .profile-chip { justify-content: center; padding: .5rem; }
      .content { padding-inline: 1.5rem; }
    }
    @media (max-width: 900px) {
      .hero-grid, .dashboard-grid, .focus-layout, .task-layout, .settings-grid { grid-template-columns: 1fr; }
      .subject-grid, .notes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .goal-grid, .analytics-grid { grid-template-columns: 1fr; }
      .analytics-grid .wide { grid-column: auto; }
    }
    @media (max-width: 599px) {
      .nav-rail { display: none; }
      .app-main { margin-left: 0; padding-bottom: 6rem; }
      .topbar { height: 4.25rem; padding: 0 1.15rem; }
      .topbar-title h2 { font-size: 1.05rem; }
      .topbar-title p, .topbar-actions .desktop-only { display: none; }
      .topbar .mobile-brand { display: flex; align-items: center; gap: .65rem; }
      .topbar .mobile-brand .brand-mark { width: 2.15rem; height: 2.15rem; border-radius: var(--md-radius-sm); }
      .topbar .mobile-brand strong { font-size: .95rem; }
      .content { padding: 1.25rem 1.15rem 1rem; }
      .welcome-card { min-height: 240px; padding: 1.35rem; }
      .goal-card { min-height: 210px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
      .subject-grid, .notes-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; gap: .85rem; }
      .form-grid .full { grid-column: auto; }
      .bottom-nav {
        position: fixed; inset: auto 0 0; z-index: 20; height: 5.25rem; padding: .4rem .5rem;
        display: grid; grid-template-columns: repeat(5, 1fr); gap: .2rem;
        background: rgba(23,19,32,.95); border-top: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px);
      }
      .bottom-nav .nav-item {
        min-height: 4.25rem; padding: .35rem .1rem; flex-direction: column; justify-content: center;
        gap: .25rem; border-radius: var(--md-radius-md); font-size: .6875rem;
      }
      .bottom-nav .nav-item .icon { width: 1.35rem; height: 1.35rem; }
      .bottom-nav .nav-item span { display: block; }
      .bottom-nav .nav-item.active { background: var(--md-secondary-container); }
      .fab { display: flex; bottom: 6rem; }
      .snackbar { bottom: 5.85rem; }
    }
  </style>

      function closeModal() {
        const dialog = $('#appDialog');
        if (typeof dialog.close === 'function') dialog.close();

      function submitModal(form) {
        const kind = $('#appDialog').dataset.kind;
        const id = $('#appDialog').dataset.id;
        const val = selector => $(selector, form)?.value;

        if (kind === 'session') {
          const session = {
            id: id || uid('session'),
            subjectId: val('#modalSubject'),
            duration: clamp(Number(val('#modalDuration')) || 1, 1, 1440),
            date: val('#modalDate') || todayKey(),
            notes: val('#modalNotes') || '',
            source: 'manual'
          };
          const idx = state.sessions.findIndex(s => s.id === id);
          if (idx >= 0) state.sessions[idx] = session;
          else state.sessions.push(session);
          persist();
          closeModal();
          render();
          showSnackbar(idx >= 0 ? 'Session updated' : 'Session logged');
          if (weekProgress() >= 100) celebrate();
          return;
        }

        if (kind === 'task') {
          const task = {
            id: id || uid('task'),
            title: val('#modalTaskTitle'),
            subjectId: val('#modalTaskSubject'),
            priority: val('#modalPriority'),
            due: val('#modalDue') || todayKey(),
            done: state.tasks.find(t => t.id === id)?.done || false,
            week: state.activeWeek
          };
          const idx = state.tasks.findIndex(t => t.id === id);
          if (idx >= 0) state.tasks[idx] = task;
          else state.tasks.push(task);
          persist();
          closeModal();
          render();
          showSnackbar(idx >= 0 ? 'Task updated' : 'Task added');
          return;
        }

        if (kind === 'application') {
          const app = {
            id: id || uid('app'),
            company: val('#modalCompany'),
            role: val('#modalRole'),
            tier: val('#modalTier'),
            city: val('#modalCity'),
            status: val('#modalStatus'),
            dateApplied: val('#modalAppDate'),
            oaDeadline: val('#modalOaDeadline'),
            stack: val('#modalAppStack')
          };
          const idx = state.applications.findIndex(a => a.id === id);
          if (idx >= 0) state.applications[idx] = app;
          else state.applications.push(app);
          persist();
          closeModal();
          render();
          showSnackbar(idx >= 0 ? 'Application updated' : 'Application tracked');
          return;
        }

        if (kind === 'note') {
          const note = {
            id: id || uid('note'),
            title: val('#modalNoteTitle'),
            subjectId: val('#modalNoteSubject'),
            body: val('#modalNoteBody'),
            updated: todayKey()
          };
          const idx = state.notes.findIndex(n => n.id === id);
          if (idx >= 0) state.notes[idx] = note;
          else state.notes.push(note);
          persist();
          closeModal();
          render();
          showSnackbar(idx >= 0 ? 'Note updated' : 'Note added');
          return;
        }

      function deleteSession(id) {
        const idx = state.sessions.findIndex(s => s.id === id);
        if (idx < 0) return;
        const [removed] = state.sessions.splice(idx, 1);
        persist();
        render();
        showSnackbar('Session deleted', () => { state.sessions.push(removed); persist(); render(); });
      }

      function deleteTask(id) {
        const idx = state.tasks.findIndex(t => t.id === id);
        if (idx < 0) return;
        state.tasks.splice(idx, 1);
        persist();
        render();
        showSnackbar('Task deleted');
      }

      function deleteApplication(id) {
        const idx = state.applications.findIndex(a => a.id === id);
        if (idx < 0) return;
        state.applications.splice(idx, 1);
        persist();
        render();
        showSnackbar('Application deleted');
      }

      function deleteNote(id) {
        const idx = state.notes.findIndex(n => n.id === id);

        persist();
        render();
        showSnackbar('Note deleted');

      function toggleTask(id) {
        const task = state.tasks.find(t => t.id === id);

        task.done = !task.done;
        persist();
        render();
        showSnackbar(task.done ? 'Task marked complete (+25 XP)' : 'Task reopened');

        if (!state.dsaState[id]) state.dsaState[id] = { solved: false, reSolves: 0, timed: false };
        state.dsaState[id].solved = !state.dsaState[id].solved;
        state.dsaState[id].lastDate = todayKey();
        persist();
        render();
        showSnackbar(state.dsaState[id].solved ? 'Problem marked solved (+20 XP)' : 'Problem marked unsolved');

      function incDSAResolve(id) {
        if (!state.dsaState[id]) state.dsaState[id] = { solved: true, reSolves: 0, timed: false };
        state.dsaState[id].reSolves = (state.dsaState[id].reSolves || 0) + 1;
        state.dsaState[id].lastDate = todayKey();
        persist();
        render();
        showSnackbar(`Re-solve logged: ${state.dsaState[id].reSolves} total (+15 XP)`);
      }

      function toggleDSATimed(id) {
        if (!state.dsaState[id]) state.dsaState[id] = { solved: true, reSolves: 0, timed: false };
        state.dsaState[id].timed = !state.dsaState[id].timed;
        persist();
        render();
        showSnackbar(state.dsaState[id].timed ? 'Marked as Timed OA Pass' : 'Timed pass removed');
      }

      function showSnackbar(message, undo) {
        const snack = $('#snackbar');
        snack.querySelector('span').textContent = message;
        const undoButton = snack.querySelector('button');
        undoButton.hidden = typeof undo !== 'function';
        snack._undo = undo;
        snack.classList.add('show');
        clearTimeout(snackbarTimer);
        snackbarTimer = setTimeout(() => snack.classList.remove('show'), 4200);
      }

      function celebrate() {
        const celebration = $('#celebration');
        const burst = $('.celebration-burst', celebration);
        $$('.confetti', celebration).forEach(n => n.remove());
        const colors = ['#c084fc','#fbbf24','#34d399','#f472b6','#38bdf8'];
        for (let i = 0; i < 22; i++) {
          const p = document.createElement('i');
          p.className = 'confetti';
          p.style.background = colors[i % colors.length];
          p.style.left = `${50 + (Math.random() * 24 - 12)}%`;
          p.style.top = `${45 + (Math.random() * 10 - 5)}%`;
          p.style.setProperty('--dx', `${Math.random() * 300 - 150}px`);
          p.style.setProperty('--dy', `${Math.random() * 280 - 90}px`);
          burst.appendChild(p);
        }
        celebration.classList.add('show');
        setTimeout(() => celebration.classList.remove('show'), 1300);
      }

      function closeFab() { $('#fab').classList.remove('open'); }
      function toggleFab() { $('#fab').classList.toggle('open'); }

      // Timer Engine
      function resetTimer(mode = 'work') {
        timer.mode = mode;
        timer.total = (mode === 'work' ? Number(state.focus.work) : Number(state.focus.break)) * 60;
        timer.remaining = timer.total;
        timer.running = false;
        clearInterval(timer.interval);
        timer.interval = null;
      }

      function updateTimerDom() {
        if (ui.view !== 'focus') return;
        const ring = $('.timer-ring .ring-progress');
        const copy = $('.timer-ring .ring-copy strong');
        const sub = $('.timer-ring .ring-copy span');
        if (!ring || !copy) return;
        const percent = timer.total ? ((timer.total - timer.remaining) / timer.total) * 100 : 0;
        const radius = 150 - 12;
        const circumference = 2 * Math.PI * radius;
        ring.style.strokeDasharray = circumference;
        ring.style.strokeDashoffset = circumference - percent / 100 * circumference;
        copy.textContent = `${pad(Math.floor(timer.remaining/60))}:${pad(timer.remaining%60)}`;
        if (sub) sub.textContent = timer.mode === 'work' ? 'focus time' : 'rest time';
      }

      function timerTick() {
        timer.remaining -= 1;
        if (timer.remaining <= 0) {
          clearInterval(timer.interval);
          timer.interval = null;
          timer.running = false;
          if (timer.mode === 'work') {
            const logged = {
              id: uid('session'),
              subjectId: state.focus.subjectId || state.subjects[0]?.id,
              duration: Number(state.focus.work),
              date: todayKey(),
              notes: 'Focus block completed',
              source: 'pomodoro'
            };
            state.sessions.push(logged);
            persist();
            showSnackbar('Focus session logged to ledger');
            celebrate();
            resetTimer('break');
          } else {
            showSnackbar('Break completed. Ready for next focus.');
            resetTimer('work');
          }
          render();
          return;
        }
        updateTimerDom();
      }

      function toggleTimer() {
        if (timer.running) {
          timer.running = false;
          clearInterval(timer.interval);
          timer.interval = null;
          showSnackbar('Timer paused');
        } else {
          timer.running = true;
          timer.interval = setInterval(timerTick, 1000);
          showSnackbar(timer.mode === 'work' ? 'Focus block started' : 'Break started');
        }
        render();
      }

      function hexToRgb(hex) {
        const val = hex.replace('#','');
        const full = val.length === 3 ? val.split('').map(c => c+c).join('') : val;
        const int = parseInt(full,16);
        return {r:(int>>16)&255, g:(int>>8)&255, b:int&255};
      }
      function mixHex(a,b,ratio) {
        const x=hexToRgb(a), y=hexToRgb(b);
        return '#'+[x.r,x.g,x.b].map((v,i)=>Math.round(v*(1-ratio)+[y.r,y.g,y.b][i]*ratio).toString(16).padStart(2,'0')).join('');
      }
      function applyAccent(hex, save = true) {
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
        state.accent = hex;
        const rgb = hexToRgb(hex);
        const luma = (0.2126*rgb.r + 0.7152*rgb.g + 0.0722*rgb.b)/255;
        const on = luma > .62 ? '#1c1827' : '#ffffff';
        const container = mixHex(hex, '#0f0c15', .55);
        const onContainer = luma > .45 ? '#1c1827' : '#f3e8ff';
        document.documentElement.style.setProperty('--md-primary',hex);
        document.documentElement.style.setProperty('--md-on-primary',on);
        document.documentElement.style.setProperty('--md-primary-container',container);
        document.documentElement.style.setProperty('--md-on-primary-container',onContainer);
        document.documentElement.style.setProperty('--md-surface-tint',hex);
        if (save) { persist(); render(); showSnackbar('Theme updated'); }
      }

      function exportData() {
        const blob = new Blob([JSON.stringify({...state, exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `pathway-437h-backup-${todayKey()}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showSnackbar('Data exported successfully');
      }

      function importData(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!imported || !Array.isArray(imported.subjects)) throw new Error('Invalid backup');
            state = { ...createCleanState(), ...imported };
            persist();
            applyAccent(state.accent, false);
            resetTimer('work');
            render();
            showSnackbar('Data restored successfully');
          } catch (e) {
            showSnackbar('Invalid backup file');
          }
        };
        reader.readAsText(file);
      }

      // Global DOM Listeners
      document.addEventListener('pointerdown', event => {
        const target = event.target.closest('[data-ripple]');
        if (!target || target.disabled) return;
        const rect = target.getBoundingClientRect();
        const ripple = document.createElement('span');
        const size = Math.max(rect.width, rect.height) * 1.3;
        ripple.className = 'ripple';
        ripple.style.width = `${size}px`;
        ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size/2}px`;
        ripple.style.top = `${event.clientY - rect.top - size/2}px`;
        target.appendChild(ripple);
        setTimeout(() => ripple.remove(), 450);
      });

      document.addEventListener('click', event => {
        const nav = event.target.closest('[data-nav]');
        if (nav) { navigate(nav.dataset.nav); return; }

        const action = event.target.closest('[data-action]');
        if (!action) return;
        const type = action.dataset.action;

        if (type === 'open-modal') { openModal(action.dataset.modal, null, action.dataset.subject || null); return; }
        if (type === 'close-modal') { closeModal(); return; }
        if (type === 'toggle-fab') { toggleFab(); return; }
        if (type === 'toggle-more') { $('#mobileMore').classList.toggle('open'); updateNav(); return; }
        if (type === 'favorite-quote') {
          const idx = state.quoteIndex % quoteData.length;
          if (state.favoriteQuotes.includes(idx)) state.favoriteQuotes = state.favoriteQuotes.filter(i => i !== idx);
          else state.favoriteQuotes.push(idx);
          persist(); render(); showSnackbar(state.favoriteQuotes.includes(idx) ? 'Quote saved' : 'Quote removed');
          return;
        }
        if (type === 'shuffle-quote') {
          state.quoteIndex = Math.floor(Math.random() * quoteData.length);
          persist(); render(); showSnackbar('New principle ready');
          return;
        }
        if (type === 'set-active-week') {
          state.activeWeek = Number(action.dataset.week) || 1;
          persist(); render(); showSnackbar(`Active focus set to Week ${state.activeWeek}`);
          return;
        }
        if (type === 'filter-plan') {
          ui.planPhaseFilter = action.dataset.phase;
          render(); return;
        }
        if (type === 'filter-apps') {
          ui.appStatusFilter = action.dataset.status;
          render(); return;
        }
        if (type === 'toggle-week-check') {
          toggleWeekCheck(action.dataset.week, action.dataset.key);
          return;
        }
        if (type === 'toggle-project-check') {
          toggleProjectCheck(action.dataset.key);
          return;
        }
        if (type === 'toggle-rule-check') {
          toggleRuleCheck(action.dataset.key);
          return;
        }
        if (type === 'toggle-dsa-solved') { toggleDSASolved(action.dataset.id); return; }
        if (type === 'inc-dsa-resolve') { incDSAResolve(action.dataset.id); return; }
        if (type === 'toggle-dsa-timed') { toggleDSATimed(action.dataset.id); return; }
        if (type === 'edit-session') { openModal('session', action.dataset.id); return; }
        if (type === 'delete-session') { deleteSession(action.dataset.id); return; }
        if (type === 'toggle-task') { toggleTask(action.dataset.id); return; }
        if (type === 'edit-task') { openModal('task', action.dataset.id); return; }
        if (type === 'delete-task') { deleteTask(action.dataset.id); return; }
        if (type === 'edit-application') { openModal('application', action.dataset.id); return; }
        if (type === 'delete-application') { deleteApplication(action.dataset.id); return; }
        if (type === 'edit-note') { openModal('note', action.dataset.id); return; }
        if (type === 'delete-note') { deleteNote(action.dataset.id); return; }
        if (type === 'task-filter') { ui.taskFilter = action.dataset.filter; render(); return; }
        if (type === 'timer-toggle') { toggleTimer(); return; }
        if (type === 'timer-reset') { resetTimer(timer.mode); render(); showSnackbar('Timer reset'); return; }
        if (type === 'timer-skip') { resetTimer(timer.mode === 'work' ? 'break' : 'work'); render(); return; }
        if (type === 'timer-mode') { resetTimer(action.dataset.mode); render(); return; }
        if (type === 'set-accent') { applyAccent(action.dataset.color); return; }
        if (type === 'export-data') { exportData(); return; }
        if (type === 'import-data') { $('#importInput').click(); return; }
        if (type === 'reset-data') {
          if (confirm('Reset workspace to zero? This clears all sessions and starts a pristine 437h ledger.')) {
            localStorage.removeItem(STORAGE_KEY);
            state = createCleanState();
            applyAccent(state.accent, false);
            resetTimer('work');
            render();
            showSnackbar('Workspace reset to clean slate (starts at 0)');
          }
          return;
        }
        if (type === 'snack-undo') {
          if (typeof $('#snackbar')._undo === 'function') $('#snackbar')._undo();
          $('#snackbar').classList.remove('show');
          return;
        }
      });

      document.addEventListener('input', event => {
        if (event.target.id === 'sessionSearch') {
          ui.sessionSearch = event.target.value;
          render();
          const s = $('#sessionSearch');
          if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
        }
        if (event.target.id === 'accentPicker') applyAccent(event.target.value, false);
      });

      document.addEventListener('change', event => {
        if (event.target.dataset.action === 'quick-app-status') {
          const app = state.applications.find(a => a.id === event.target.dataset.id);
          if (app) {
            app.status = event.target.value;
            persist();
            render();
            showSnackbar(`Status updated to ${app.status}`);
          }
          return;
        }
        if (event.target.id === 'sessionSubjectFilter') { ui.sessionSubject = event.target.value; render(); }
        if (event.target.id === 'sessionSort') { ui.sessionSort = event.target.value; render(); }
        if (event.target.id === 'dsaPatternSelect') { ui.dsaPatternFilter = event.target.value; render(); }
        if (event.target.id === 'dsaStatusSelect') { ui.dsaStatusFilter = event.target.value; render(); }
        if (event.target.id === 'noteSubjectFilter') { ui.noteSubject = event.target.value; render(); }
        if (event.target.id === 'accentPicker') applyAccent(event.target.value);
        if (event.target.id === 'focusSubject') { state.focus.subjectId = event.target.value; persist(); showSnackbar('Focus pillar updated'); }
        if (event.target.id === 'timerWork') { state.focus.work = clamp(Number(event.target.value) || 25, 1, 120); persist(); if (!timer.running && timer.mode === 'work') resetTimer('work'); }
        if (event.target.id === 'timerBreak') { state.focus.break = clamp(Number(event.target.value) || 5, 1, 60); persist(); if (!timer.running && timer.mode === 'break') resetTimer('break'); }
      });

      $('#appDialog').addEventListener('submit', event => {
        event.preventDefault();
        submitModal(event.target);
      });

      $('#importInput').addEventListener('change', event => {
        if (event.target.files?.[0]) importData(event.target.files[0]);
        event.target.value = '';
      });

      $('#appDialog').addEventListener('click', event => {
        if (event.target === $('#appDialog')) closeModal();
      });

      // Initialization
      state = loadState();
      applyAccent(state.accent, false);
      resetTimer('work');
      render();
    })();
  </script>
</body>
</html>
